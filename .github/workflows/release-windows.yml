# Windows release for Local Voice AI, and the source of the in-app update.
#
# Why this file exists next to apps/local-voice/.github/workflows/: those came
# with the Handy subtree and sit BELOW the repo root, where GitHub never looks
# for them — they have never run. This one is at the root and does run. Its
# Windows steps (Vulkan SDK, VC++ redist, ONNX Runtime, SPIRV-Headers) are
# copied from that inherited build.yml rather than re-derived, because each of
# them fixes a specific, hard-won Windows build failure documented there.
#
# The update path: `createUpdaterArtifacts` (tauri.conf.json) makes the bundler
# emit an .exe + .sig per build; tauri-action collects them into `latest.json`
# and attaches it to the release. The app polls
# https://github.com/MrP42/local-voice-ai/releases/latest/download/latest.json,
# which only resolves for a PUBLISHED, non-prerelease release of a PUBLIC repo
# — hence `draft: false` below.
name: "Release (Windows)"

# `app-v*`, not `v*`: this repo carries 63 tags from the Handy subtree, and
# Handy's own versions ran up to v0.9.4 — `v0.3.1` there is a release of a
# different program. Our releases get their own namespace so the two can never
# be confused, and so re-pushing an upstream tag cannot trigger a build.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      repack_tag:
        description: >-
          Nur die portablen ZIPs und den Installer mit Modellen eines bestehenden Releases neu
          bauen und ersetzen (z. B. app-v0.23.0). Baut die EXE aus diesem Tag, nimmt Packskripte
          und Installer-Vorlage aus dem gestarteten Zweig; der schlanke Installer und
          latest.json bleiben unberuehrt.
        required: false
        default: ""

# Eine gemeinsame Sperre fuer alle Release-Laeufe (lva#869): "latest" und latest.json werden
# am Ende eines Laufs gesetzt; zwei Laeufe verschiedener Tags duerfen sich dabei nicht
# ueberholen. Das Mac-Skript wartet, solange hier ein Lauf aktiv ist. GitHub haelt je Gruppe
# nur EINEN wartenden Lauf: ein dritter verdraengt den wartenden (der wird abgebrochen und
# muss neu gestartet werden). Releases deshalb nacheinander anstossen.
concurrency:
  group: release-windows
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/local-voice

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    # lva#889: scripts/release-entwurf-pruefen.ps1 prueft vor jedem Upload, dass das Ziel noch ein
    # Entwurf ist; beim Nachpacken ist ein veroeffentlichtes Ziel gewollt.
    env:
      LVA_NACHPACKEN: ${{ inputs.repack_tag }}
    steps:
      - name: Enable long paths
        shell: pwsh
        working-directory: .
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Nachpacken: Quellen des Release-Tags, aber Packskript, Paketdateien und
      # Release-Text aus dem gestarteten Stand (dort liegt die Korrektur).
      - name: Check out release tag for repack
        if: inputs.repack_tag != ''
        shell: bash
        working-directory: .
        env:
          REPACK_TAG: ${{ inputs.repack_tag }}
        run: |
          set -euo pipefail
          [[ "$REPACK_TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Ungueltiger repack_tag: $REPACK_TAG"; exit 1; }
          FIX_SHA="$(git rev-parse HEAD)"
          git checkout --quiet "refs/tags/$REPACK_TAG"
          git checkout "$FIX_SHA" -- apps/local-voice/scripts/build-portable-zip.ps1 \
            apps/local-voice/scripts/release-body.md apps/local-voice/src-tauri/portable \
            apps/local-voice/scripts/build-installer-modelle.ps1 apps/local-voice/src-tauri/nsis \
            apps/local-voice/scripts/sign-windows.ps1 apps/local-voice/scripts/sign-windows-config.ps1 \
            apps/local-voice/scripts/release-entwurf-pruefen.ps1
          git status --short

      - name: Read version from tauri.conf.json
        id: version
        shell: bash
        env:
          REPACK_TAG: ${{ inputs.repack_tag }}
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Hotfix (lva#869): Versionsnotiz ../../docs/releases/<Version>.md beginnt mit
          # "# Local Voice AI <Version> (Hotfix)". Dann nur schlanker Installer + latest.json,
          # Notiz als Release-Text und als Aenderungsliste im Update-Fenster.
          NOTES="../../docs/releases/${VERSION}.md"
          PATCH="${VERSION##*.}"
          # Patch >= 1 ist per Definition ein Hotfix (apps/local-voice/AGENTS.md#hotfixes):
          # ohne gekennzeichnete Notiz kein Lauf, statt still als Voll-Release zu bauen.
          # Nicht beim Nachpacken (lva#887): aeltere Patch-Releases (0.28.1 bis 0.28.4) sind
          # Voll-Releases ohne Hotfix-Notiz, und das Nachpacken veroeffentlicht nichts Neues.
          if [ -z "${REPACK_TAG:-}" ] && [ "$PATCH" != "0" ] && { [ ! -f "$NOTES" ] || ! head -n 1 "$NOTES" | grep -q '(Hotfix)'; }; then
            echo "::error::$VERSION ist ein Hotfix: $NOTES mit erster Zeile '# Local Voice AI ${VERSION} (Hotfix)' fehlt"; exit 1
          fi
          if [ -f "$NOTES" ] && head -n 1 "$NOTES" | grep -q '(Hotfix)'; then
            # Pflichtinhalt: genau diese Version im Titel und mindestens ein Abschnitt "## ".
            head -n 1 "$NOTES" | tr -d '\r' | grep -qxF "# Local Voice AI ${VERSION} (Hotfix)" \
              || { echo "::error::$NOTES: erste Zeile muss '# Local Voice AI ${VERSION} (Hotfix)' sein"; exit 1; }
            grep -q '^## ' "$NOTES" || { echo "::error::$NOTES: keine Aenderung (Abschnitt '## ') beschrieben"; exit 1; }
            echo "hotfix=true" >> "$GITHUB_OUTPUT"
            echo "Hotfix-Lauf: $NOTES"
          else
            echo "hotfix=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag must name the version the app will report — otherwise the updater
      # compares against a version that was never built and either loops or
      # never fires. Fail loudly instead of shipping a mismatched release.
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/app-v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag app-v$TAG does not match tauri.conf.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/local-voice/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan does find_package(SPIRV-Headers CONFIG REQUIRED); the CI
      # Vulkan SDK does not expose a findable SPIRV-HeadersConfig.cmake.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # Ship the VC++ runtime app-local so the app starts without a current
      # Microsoft redistributable. build.rs stages these into transcribe-libs/.
      - name: Locate VC++ runtime redist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $redistVersion = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          if (-not (Test-Path $archDir)) { throw "VC++ redist arch dir not found: $archDir" }
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      # Microsoft's ONNX Runtime build (SSE2 baseline + MLAS runtime dispatch)
      # instead of pyke's AVX2-baseline default, which crashes pre-Haswell CPUs
      # in a static initializer before main().
      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Quelle: NuGet-Paket Microsoft.ML.OnnxRuntime (Microsofts eigener Bau, SSE2-Basis). Das fruehere
          # GitHub-Release-ZIP (github.com/microsoft/onnxruntime/releases) ist am 17.11.2026 nicht mehr
          # erreichbar (404, Release-Lauf app-v0.26.0 scheiterte hier); das NuGet-Paket enthaelt
          # die benoetigten Dateien (runtimes/win-x64/native: onnxruntime.dll, onnxruntime.lib, providers_shared). Die Pruefsumme
          # ist festgenagelt; bei neuer Version Version UND Pruefsumme gemeinsam anheben.
          $ORT_VERSION = "1.24.2"
          $ORT_SHA256 = "782564d3d68e87269ea1812cc94710ad06fe014faf093f01a6f89d0bd58719d3"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ORT_VERSION/microsoft.ml.onnxruntime.$ORT_VERSION.nupkg"
          Invoke-WebRequest -Uri $url -OutFile ort.nupkg
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath ort.nupkg).Hash.ToLowerInvariant()
          if ($hash -ne $ORT_SHA256) { throw "ONNX-Runtime-Paket: Pruefsumme stimmt nicht ($hash)" }
          Copy-Item ort.nupkg ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-pkg -Force
          $native = (Resolve-Path "ort-pkg/runtimes/win-x64/native").Path
          foreach ($f in @("onnxruntime.lib", "onnxruntime.dll")) { if (-not (Test-Path (Join-Path $native $f))) { throw "$f fehlt im Paket" } }
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$native"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      # Not in git (gitignored *.onnx-class binaries); the app cannot compile
      # without it (see AGENTS.md, "Model Setup").
      - name: Fetch Silero VAD model
        shell: pwsh
        run: |
          # Third-party host -> pinned SHA-256: a swapped model fails the
          # build instead of shipping inside the installer.
          $ErrorActionPreference = 'Stop'
          $vadSha256 = "a35ebf52fd3ce5f1469b2a36158dba761bc47b973ea3382b3186ca15b1f5af28"
          New-Item -ItemType Directory -Force src-tauri/resources/models | Out-Null
          $out = "src-tauri/resources/models/silero_vad_v4.onnx"
          Invoke-WebRequest -Uri "https://blob.handy.computer/silero_vad_v4.onnx" -OutFile $out
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $vadSha256) { throw "silero_vad_v4.onnx hash mismatch: $actual" }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Authenticode (SmartScreen-Herausgeber). Anbieter per Repo-Variable WINDOWS_SIGN_PROVIDER
      # (azure | esigner), leer = unsigniert wie bisher. Tauri signiert ueber signCommand die
      # App-EXE, das Deinstallationsprogramm und den Installer VOR der Updater-.sig; siehe
      # scripts/sign-windows.ps1. Das Updater-Schluesselpaar bleibt davon getrennt.
      - name: Prepare Authenticode signing
        id: sign
        shell: pwsh
        run: ./scripts/sign-windows-config.ps1 -OutFile (Join-Path $env:RUNNER_TEMP 'sign.conf.json')
        env:
          LVA_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
          # Gesetzt (1/true): ohne Signaturdienst bricht der Lauf ab (lva#739, docs/FIRMENNETZ.md).
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
          CODESIGNTOOL_URL: ${{ vars.CODESIGNTOOL_URL }}

      - name: Read release body
        id: body
        shell: bash
        run: |
          if [ "${{ steps.version.outputs.hotfix }}" = "true" ]; then
            SRC="../../docs/releases/${{ steps.version.outputs.version }}.md"
          else
            SRC="scripts/release-body.md"
          fi
          {
            echo "text<<RELEASE_BODY_EOF"
            cat "$SRC"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # lva#869: Ein schon veroeffentlichtes Release (Wiederholung eines Tags) wuerde tauri-action
      # trotz releaseDraft live ueberschreiben. Nur ein fehlendes oder ein Entwurfs-Release ist Ziel.
      - name: Refuse published release as target
        if: inputs.repack_tag == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="app-v${{ steps.version.outputs.version }}"
          # releases/tags/<tag> liefert veroeffentlichte Releases; ein Entwurf kommt je nach
          # Rechten des Tokens als 404 oder mit draft=true (lva#887). Ziel sein darf nur ein
          # fehlendes Release oder ein Entwurf (Wiederholung nach einem Fehler vor dem
          # Veroeffentlichen). Nur ein eindeutiges 404 gilt als "fehlt"; alles andere bricht ab.
          if OUT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft 2>&1); then
            if [ "$OUT" = "true" ]; then
              echo "Ziel $TAG: Entwurf vorhanden, Lauf setzt ihn fort"
              exit 0
            fi
            if [ "$OUT" = "false" ]; then
              echo "::error::$TAG ist bereits veroeffentlicht. Korrektur als neue Patch-Version, nicht durch Wiederholung."
            else
              echo "::error::Unerwartete Antwort fuer $TAG: $OUT"
            fi
            exit 1
          fi
          if ! printf '%s' "$OUT" | grep -q 'HTTP 404'; then
            echo "::error::Release-Abfrage fuer $TAG fehlgeschlagen (kein eindeutiges 404): $OUT"
            exit 1
          fi
          echo "Ziel $TAG: nicht veroeffentlicht (neu oder Entwurf)"

      - name: Build and publish
        if: inputs.repack_tag == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the bundler emits no .sig and the app rejects every
          # update it downloads. Repository secret; the private key half of the
          # pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without a password, so none is passed. If it is
          # ever replaced by a password-protected one, add the matching secret here.
          LVA_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        with:
          projectPath: apps/local-voice
          tagName: app-v${{ steps.version.outputs.version }}
          releaseName: Local Voice AI ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.body.outputs.text }}
          # Erst als Entwurf (lva#869): Installierte Apps sehen das Release erst, wenn der
          # letzte Schritt Authenticode und Update-Manifest geprueft und veroeffentlicht hat.
          # `releases/latest/download/latest.json` loest einen Entwurf nicht auf.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # gpu-vulkan: STT (transcribe-cpp) rechnet auf der GPU per Vulkan, mit
          # Rueckfall auf die CPU-Backends. Braucht das Vulkan-SDK und die
          # SPIRV-Headers der Schritte oben; build.rs buendelt ggml-vulkan.dll
          # ueber transcribe-libs/ (tauri.windows.conf.json), keine Extra-Ressource.
          args: --features gpu-vulkan --bundles nsis,updater ${{ steps.sign.outputs.config != '' && format('--config {0}', steps.sign.outputs.config) || '' }}

      # Der Bundler signiert local-voice-ai.exe nur fuer die Dauer des Buendelns und stellt danach
      # die unsignierte Datei wieder her (tauri-bundler bundle.rs). Die Installer sind signiert,
      # die Portable-ZIPs kopieren aber diese EXE: darum hier einmal selbst signieren und alles
      # pruefen. continue-on-error: der Schlussschritt prueft den Installer am Release hart; Installer mit Modellen
      # und SBOM sollen folgen. Schlaegt es fehl, werden die ZIPs nicht unsigniert hochgeladen.
      - name: Sign app EXE and verify Authenticode
        id: signexe
        if: inputs.repack_tag == '' && steps.sign.outputs.config != ''
        continue-on-error: true
        shell: pwsh
        env:
          LVA_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          ./scripts/sign-windows.ps1 src-tauri/target/release/local-voice-ai.exe
          $files = @(Get-Item src-tauri/target/release/local-voice-ai.exe) + @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*-setup.exe')
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "Nicht gueltig signiert: $($f.Name) ($($sig.Status))" }
            Write-Host "OK $($f.Name): $($sig.SignerCertificate.Subject)"
          }

      # Nachpacken: dieselbe EXE wie im Release (gleicher Tag, gleiche Features), ohne Bundle
      # und ohne Veroeffentlichung. Der Release-Text folgt erst nach erfolgreichem Upload.
      - name: Build executable for repack
        if: inputs.repack_tag != ''
        shell: bash
        env:
          # createUpdaterArtifacts ist gesetzt; ohne Schluessel koennte das CLI abbrechen.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LVA_SIGN_CONFIG: ${{ steps.sign.outputs.config }}
          LVA_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          pnpm tauri build --no-bundle --features gpu-vulkan
          # --no-bundle ruft kein signCommand auf: die EXE fuer die ZIPs hier selbst signieren.
          if [ -n "$LVA_SIGN_CONFIG" ]; then
            pwsh -NoProfile -File scripts/sign-windows.ps1 src-tauri/target/release/local-voice-ai.exe
          fi

      # Portable Versionen (ZIP, ohne Installation). Packt die EXE, die tauri-action eben
      # gebaut hat; siehe scripts/build-portable-zip.ps1. continue-on-error: ein Fehler hier
      # darf weder das veroeffentlichte Release noch den SBOM-Upload danach verhindern; der
      # Schritt bleibt im Lauf als fehlgeschlagen sichtbar. Beim Nachpacken (repack_tag) sind
      # die ZIPs der einzige Zweck: dort bricht ein Fehler den Lauf ab.
      - name: Build portable ZIP
        if: steps.signexe.outcome != 'failure' && steps.version.outputs.hotfix != 'true'
        continue-on-error: ${{ inputs.repack_tag == '' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'portable'
          ./scripts/build-portable-zip.ps1 -Release -SmokeTest -OutDir $out
          ./scripts/release-entwurf-pruefen.ps1 -Tag "app-v${{ steps.version.outputs.version }}"
          gh release upload "app-v${{ steps.version.outputs.version }}" (Get-ChildItem $out -File).FullName --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Portables Paket mit Firmenprofil (lva#882): richtlinie.json mit strengen Voreinstellungen,
      # Laufzeiten fuer Vorlesen und lokale KI (CPU) liegen bei, dazu die Hashliste aller
      # Programmdateien. Laeuft nur, wenn der gebaute Quellstand die Richtlinie kennt: beim
      # Nachpacken einer aelteren Version wuerde die EXE richtlinie.json nicht lesen, und das
      # Paket verspraeche Schalter, die nichts bewirken. Das Skript bricht aus demselben Grund
      # ab, solange ein gesetzter Schalter im Code nicht durchgesetzt ist (`--richtlinie-zeigen`).
      # Der Name traegt "-unsigniert", solange die EXE keine gueltige Authenticode-Signatur hat.
      - name: Build portable ZIP with company profile
        if: >-
          steps.signexe.outcome != 'failure' && steps.version.outputs.hotfix != 'true' &&
          hashFiles('apps/local-voice/src-tauri/src/richtlinie/**') != ''
        continue-on-error: ${{ inputs.repack_tag == '' }}
        shell: pwsh
        run: |
          $env:TMP = $env:RUNNER_TEMP; $env:TEMP = $env:RUNNER_TEMP
          $out = Join-Path $env:RUNNER_TEMP 'portable-firmenprofil'
          ./scripts/build-portable-zip.ps1 -Release -Firmenprofil -SmokeTest -OutDir $out
          $tag = "app-v${{ steps.version.outputs.version }}"
          $new = @(Get-ChildItem $out -File)
          $hashliste = 'SHA256SUMS-programmdateien.txt'
          $firmenprofilMuster = '^LocalVoiceAI_' + [regex]::Escape('${{ steps.version.outputs.version }}') +
            '_x64-portable-firmenprofil(-unvollstaendig)?(-unsigniert)?(\.teil\d+von\d+)?\.zip(\.sha256)?$'
          if ($new.Name -notcontains $hashliste) { throw 'Hashliste der Programmdateien fehlt' }
          ./scripts/release-entwurf-pruefen.ps1 -Tag $tag
          gh release upload $tag $new.FullName --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          # Wechselt der Name (Teilzahl, "-unsigniert" entfaellt mit der Signatur), bleiben alte
          # Dateien sonst am Release liegen.
          $assets = gh release view $tag --json assets --jq '.assets[].name' --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed" }
          foreach ($a in $assets) {
            # Nur Namen, die build-portable-zip.ps1 erzeugen kann (ZIP oder Teil-ZIP, je mit
            # .sha256); fremde Anhaenge wie ein ...-firmenprofil-IT-Freigabe.pdf bleiben stehen.
            $alt = $a -match $firmenprofilMuster -or $a -eq $hashliste
            if ($alt -and ($new.Name -notcontains $a)) {
              Write-Host "Veraltete Datei entfernen: $a"
              gh release delete-asset $tag $a --yes --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -ne 0) { throw "gh release delete-asset failed" }
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Offline-Variante: laedt die Modelle einmal ueber `--provision` (derselbe Weg wie die
      # Modellseite) und verteilt sie auf ZIPs unter 2 GiB (GitHub-Grenze je Datei).
      # HF_TOKEN (Repo-Secret) ist fuer das zugangsbeschraenkte deutsche Phonon-Modell noetig;
      # ohne ihn wird es mit Warnung ausgelassen. Arbeitsordner auf RUNNER_TEMP (Laufwerk D:),
      # weil C: fuer ~16 GB Zwischenstand zu knapp ist.
      - name: Build portable offline ZIPs
        if: steps.signexe.outcome != 'failure' && steps.version.outputs.hotfix != 'true'
        continue-on-error: ${{ inputs.repack_tag == '' }}
        shell: pwsh
        run: |
          $env:TMP = $env:RUNNER_TEMP; $env:TEMP = $env:RUNNER_TEMP
          $out = Join-Path $env:RUNNER_TEMP 'portable-offline'
          # Ohne HF_TOKEN fehlt nur das deutsche Phonon-Modell (gated); alles andere ist
          # oeffentlich. Was drin ist, steht in INHALT.txt im ZIP und als Warnung im Lauf.
          ./scripts/build-portable-zip.ps1 -Release -Offline -SmokeTest -OutDir $out
          $tag = "app-v${{ steps.version.outputs.version }}"
          $new = @(Get-ChildItem $out -File)
          ./scripts/release-entwurf-pruefen.ps1 -Tag $tag
          gh release upload $tag $new.FullName --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          # Aendert sich die Teilzahl beim Nachpacken, bleiben alte Teile (teilNvonM) sonst liegen.
          $assets = gh release view $tag --json assets --jq '.assets[].name' --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed" }
          foreach ($a in $assets) {
            if ($a -like '*_x64-portable-offline.*' -and ($new.Name -notcontains $a)) {
              Write-Host "Veraltetes Teil entfernen: $a"
              gh release delete-asset $tag $a --yes --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -ne 0) { throw "gh release delete-asset failed" }
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Installer mit Modellen (lva#574): Nemotron 3.5 ASR, Parakeet V3 und Phonon (DE+EN mit
      # allen Stimmen) als abwaehlbare Komponenten, ohne Download nach der Installation. Dieselbe
      # Vorlage (nsis/installer.nsi) baut mit LVA_VORINSTALLIERT die Komponentenseite ein. Der
      # schlanke Installer oben bleibt Quelle von latest.json: In-App-Updates laden weiter nur
      # die App (~150 MB), die Modelle im Datenordner bleiben. Daher hier ohne Updater-Artefakte.
      # continue-on-error wie bei den ZIPs: ein Fehler darf das Release nicht verhindern.
      - name: Build installer with models
        if: steps.version.outputs.hotfix != 'true'
        continue-on-error: ${{ inputs.repack_tag == '' }}
        shell: pwsh
        run: |
          # Nachpacken eines Tags vor lva#574: dessen Erststart stellt bei zwei installierten
          # Spracherkennungen nichts ein (firstRunSetup.ts). Dann keinen Installer mit Modellen.
          if (-not (Select-String -Path src/components/intro-tour/firstRunSetup.ts -Pattern 'lva#574' -Quiet)) {
            Write-Host '::notice::Release-Stand ohne lva#574: Installer mit Modellen wird nicht gebaut.'
            exit 0
          }
          $env:TMP = $env:RUNNER_TEMP; $env:TEMP = $env:RUNNER_TEMP
          $payload = Join-Path $env:RUNNER_TEMP 'vorinstalliert'
          ./scripts/build-installer-modelle.ps1 -RequireHfToken -SmokeTest -OutDir $payload
          $conf = Join-Path $env:RUNNER_TEMP 'ohne-updater.conf.json'
          [System.IO.File]::WriteAllText($conf, '{"bundle":{"createUpdaterArtifacts":false}}')
          $payloadBytes = (Get-ChildItem $payload -Recurse -File | Measure-Object Length -Sum).Sum
          # Den schlanken Installer von tauri-action wegraeumen: sonst fiele ein Bau, der die
          # Nutzlast still nicht einbindet, unter dem alten Dateinamen nicht auf.
          Remove-Item src-tauri/target/release/bundle/nsis -Recurse -Force -ErrorAction SilentlyContinue
          $env:LVA_VORINSTALLIERT = $payload
          $signArgs = if ($env:LVA_SIGN_CONFIG) { @('--config', $env:LVA_SIGN_CONFIG) } else { @() }
          pnpm tauri build --features gpu-vulkan --bundles nsis --config $conf @signArgs
          if ($LASTEXITCODE -ne 0) { throw "tauri build (Installer mit Modellen) fehlgeschlagen" }
          $version = "${{ steps.version.outputs.version }}"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter "*_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer mit Modellen nicht gefunden" }
          if ($env:LVA_SIGN_CONFIG) {
            $sig = Get-AuthenticodeSignature -LiteralPath $setup.FullName
            if ($sig.Status -ne 'Valid') { throw "Installer mit Modellen nicht gueltig signiert ($($sig.Status))" }
          }
          # NSIS-Grenze 2 GB, GitHub 2 GiB je Datei: mit Reserve pruefen.
          if ($setup.Length -ge [int64](1.95 * 1GB)) { throw ("Installer mit Modellen zu gross: {0:N0} MB" -f ($setup.Length / 1MB)) }
          # Modellgewichte komprimieren kaum: deutlich kleiner heisst, die Nutzlast fehlt.
          if ($setup.Length -lt [int64](0.7 * $payloadBytes)) { throw ("Installer mit Modellen nur {0:N0} MB, Nutzlast {1:N0} MB: Modelle nicht eingebunden" -f ($setup.Length / 1MB), ($payloadBytes / 1MB)) }
          $out = Join-Path $env:RUNNER_TEMP 'installer-modelle'
          New-Item -ItemType Directory -Force $out | Out-Null
          $name = "LocalVoiceAI_${version}_x64-setup-mit-modellen.exe"
          $target = Join-Path $out $name
          Copy-Item $setup.FullName $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$target.sha256", "$hash  $name`n", [System.Text.Encoding]::ASCII)
          Write-Host ("Installer mit Modellen: {0} ({1:N0} MB)" -f $name, ($setup.Length / 1MB))
          ./scripts/release-entwurf-pruefen.ps1 -Tag "app-v$version"
          gh release upload "app-v$version" $target "$target.sha256" --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LVA_SIGN_CONFIG: ${{ steps.sign.outputs.config }}
          LVA_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      # Nachpacken: Release-Text erst anpassen, wenn beide ZIP-Varianten hochgeladen sind.
      - name: Update release notes for repack
        if: inputs.repack_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "app-v${{ steps.version.outputs.version }}" --notes-file scripts/release-body.md --repo "$GITHUB_REPOSITORY"

      # Issue #7: SBOM (CycloneDX 1.5) and the licence notices ship with every
      # release. The notices file is the committed one (resources/, also inside
      # the installer; kept current by `gen-notices.mjs --check`). The SBOM is a
      # build artefact, so it is generated here. A failed SBOM must not undo the
      # release that tauri-action already published: continue-on-error, and the
      # upload below attaches whatever exists.
      - name: Generate SBOM
        continue-on-error: true
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked
          node scripts/gen-notices.mjs --only sbom

      - name: Attach SBOM and third-party notices to the release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILES=(src-tauri/resources/THIRD-PARTY-NOTICES.md)
          SBOM="src-tauri/target/sbom/local-voice-ai-${VERSION}.cdx.json"
          if [ -f "$SBOM" ]; then FILES+=("$SBOM"); else echo "::warning::SBOM $SBOM missing, uploading notices only"; fi
          pwsh -NoProfile -File scripts/release-entwurf-pruefen.ps1 -Tag "app-v${VERSION}" || exit 1
          gh release upload "app-v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # lva#869: Abschluss jedes Release-Laufs (nicht beim Nachpacken). Das Release ist bis hier
      # ein Entwurf. Geprueft wird, was tatsaechlich am Release haengt, nicht der lokale Baustand:
      # Authenticode des Installers (falls Signierung eingeschaltet), latest.json als Satz
      # (Version, Installer vorhanden, Signatur = .sig-Datei). Erst dann veroeffentlichen und
      # "latest" auf das hoechste app-v-Release setzen (ein spaeter Hotfix einer aelteren Linie
      # darf ein neueres Release nicht verdecken). Zuletzt die oeffentlichen URLs pruefen.
      - name: Verify release assets (draft)
        if: inputs.repack_tag == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LVA_SIGN_CONFIG: ${{ steps.sign.outputs.config }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.version }}"
          $tag = "app-v$version"
          $work = Join-Path $env:RUNNER_TEMP 'pruefung'
          New-Item -ItemType Directory -Force $work | Out-Null
          gh release download $tag --pattern latest.json --dir $work --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "latest.json fehlt am Release" }
          $m = Get-Content (Join-Path $work 'latest.json') -Raw | ConvertFrom-Json
          if (($m.version -replace '^v','') -ne $version) { throw "latest.json nennt $($m.version) statt $version" }
          $win = $m.platforms.'windows-x86_64'
          if (-not $win -or -not $win.url -or -not $win.signature) { throw "kein vollstaendiger windows-x86_64-Eintrag" }
          $asset = [System.Uri]::UnescapeDataString(($win.url -split '/')[-1])
          gh release download $tag --pattern $asset --pattern "$asset.sig" --dir $work --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Installer $asset oder $asset.sig fehlt am Release" }
          $sig = (Get-Content (Join-Path $work "$asset.sig") -Raw).Trim()
          if ($sig -ne $win.signature.Trim()) { throw "Signatur in latest.json passt nicht zu $asset.sig" }
          if ($env:LVA_SIGN_CONFIG) {
            $a = Get-AuthenticodeSignature -LiteralPath (Join-Path $work $asset)
            if ($a.Status -ne 'Valid' -or -not $a.TimeStamperCertificate) { throw "Installer nicht gueltig signiert ($($a.Status))" }
          }
          Write-Host "Release-Dateien $version geprueft: $asset"

      - name: Publish release and keep highest as latest
        if: inputs.repack_tag == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release edit "app-v$VERSION" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
          HIGHEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
            | grep -E '^app-v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^app-v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          echo "Hoechstes Release: $HIGHEST"
          gh release edit "app-v$HIGHEST" --latest --repo "$GITHUB_REPOSITORY"
          M="$RUNNER_TEMP/live-latest.json"
          URL=$(gh release download "app-v$VERSION" --pattern latest.json --output - --repo "$GITHUB_REPOSITORY" | jq -r '.platforms["windows-x86_64"].url')
          curl -fsIL "$URL" > /dev/null || { echo "::error::Installer-URL oeffentlich nicht erreichbar: $URL"; exit 1; }
          if [ "$HIGHEST" = "$VERSION" ]; then
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" -o "$M"
            [ "$(jq -r .version "$M" | sed 's/^v//')" = "$VERSION" ] || { echo "::error::releases/latest liefert nicht $VERSION"; exit 1; }
          fi
          echo "Veroeffentlicht: $VERSION (latest: $HIGHEST)"
