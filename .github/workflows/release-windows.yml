# Windows release for Local Voice AI, and the source of the in-app update.
#
# Why this file exists next to apps/local-voice/.github/workflows/: those came
# with the Handy subtree and sit BELOW the repo root, where GitHub never looks
# for them — they have never run. This one is at the root and does run. Its
# Windows steps (Vulkan SDK, VC++ redist, ONNX Runtime, SPIRV-Headers) are
# copied from that inherited build.yml rather than re-derived, because each of
# them fixes a specific, hard-won Windows build failure documented there.
#
# The update path: `createUpdaterArtifacts` (tauri.conf.json) makes the bundler
# emit an .exe + .sig per build; tauri-action collects them into `latest.json`
# and attaches it to the release. The app polls
# https://github.com/MrP42/local-voice-ai/releases/latest/download/latest.json,
# which only resolves for a PUBLISHED, non-prerelease release of a PUBLIC repo
# — hence `draft: false` below.
name: "Release (Windows)"

# `app-v*`, not `v*`: this repo carries 63 tags from the Handy subtree, and
# Handy's own versions ran up to v0.9.4 — `v0.3.1` there is a release of a
# different program. Our releases get their own namespace so the two can never
# be confused, and so re-pushing an upstream tag cannot trigger a build.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      repack_tag:
        description: >-
          Nur die portablen ZIPs eines bestehenden Releases neu bauen und ersetzen
          (z. B. app-v0.23.0). Baut die EXE aus diesem Tag, nimmt das Packskript aus dem
          gestarteten Zweig; Installer und latest.json bleiben unberuehrt.
        required: false
        default: ""

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/local-voice

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        working-directory: .
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Nachpacken: Quellen des Release-Tags, aber Packskript, Paketdateien und
      # Release-Text aus dem gestarteten Stand (dort liegt die Korrektur).
      - name: Check out release tag for repack
        if: inputs.repack_tag != ''
        shell: bash
        working-directory: .
        env:
          REPACK_TAG: ${{ inputs.repack_tag }}
        run: |
          set -euo pipefail
          [[ "$REPACK_TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Ungueltiger repack_tag: $REPACK_TAG"; exit 1; }
          FIX_SHA="$(git rev-parse HEAD)"
          git checkout --quiet "refs/tags/$REPACK_TAG"
          git checkout "$FIX_SHA" -- apps/local-voice/scripts/build-portable-zip.ps1 \
            apps/local-voice/scripts/release-body.md apps/local-voice/src-tauri/portable
          git status --short

      - name: Read version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag must name the version the app will report — otherwise the updater
      # compares against a version that was never built and either loops or
      # never fires. Fail loudly instead of shipping a mismatched release.
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/app-v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag app-v$TAG does not match tauri.conf.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      # Entwicklungskanal (dev_update.rs): ein Release darf den Entwicklungsschluessel
      # nie eingebacken haben, sonst spielte es fremd signierte Testversionen ein.
      - name: Refuse development update channel
        shell: bash
        run: |
          if [ -n "${LVA_DEV_UPDATE_PUBKEY:-}" ]; then
            echo "LVA_DEV_UPDATE_PUBKEY ist gesetzt: Release-Bau mit Entwicklungskanal abgelehnt" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/local-voice/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan does find_package(SPIRV-Headers CONFIG REQUIRED); the CI
      # Vulkan SDK does not expose a findable SPIRV-HeadersConfig.cmake.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # Ship the VC++ runtime app-local so the app starts without a current
      # Microsoft redistributable. build.rs stages these into transcribe-libs/.
      - name: Locate VC++ runtime redist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $redistVersion = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          if (-not (Test-Path $archDir)) { throw "VC++ redist arch dir not found: $archDir" }
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      # Microsoft's ONNX Runtime build (SSE2 baseline + MLAS runtime dispatch)
      # instead of pyke's AVX2-baseline default, which crashes pre-Haswell CPUs
      # in a static initializer before main().
      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ORT_VERSION = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ORT_VERSION/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      # Not in git (gitignored *.onnx-class binaries); the app cannot compile
      # without it (see AGENTS.md, "Model Setup").
      - name: Fetch Silero VAD model
        shell: pwsh
        run: |
          # Third-party host -> pinned SHA-256: a swapped model fails the
          # build instead of shipping inside the installer.
          $ErrorActionPreference = 'Stop'
          $vadSha256 = "a35ebf52fd3ce5f1469b2a36158dba761bc47b973ea3382b3186ca15b1f5af28"
          New-Item -ItemType Directory -Force src-tauri/resources/models | Out-Null
          $out = "src-tauri/resources/models/silero_vad_v4.onnx"
          Invoke-WebRequest -Uri "https://blob.handy.computer/silero_vad_v4.onnx" -OutFile $out
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $vadSha256) { throw "silero_vad_v4.onnx hash mismatch: $actual" }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release body
        id: body
        shell: bash
        run: |
          {
            echo "text<<RELEASE_BODY_EOF"
            cat scripts/release-body.md
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: inputs.repack_tag == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the bundler emits no .sig and the app rejects every
          # update it downloads. Repository secret; the private key half of the
          # pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without a password, so none is passed. If it is
          # ever replaced by a password-protected one, add the matching secret here.
        with:
          projectPath: apps/local-voice
          tagName: app-v${{ steps.version.outputs.version }}
          releaseName: Local Voice AI ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.body.outputs.text }}
          # Published, not draft: `releases/latest/download/latest.json` — the
          # updater endpoint — does not resolve to a draft.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # gpu-vulkan: STT (transcribe-cpp) rechnet auf der GPU per Vulkan, mit
          # Rueckfall auf die CPU-Backends. Braucht das Vulkan-SDK und die
          # SPIRV-Headers der Schritte oben; build.rs buendelt ggml-vulkan.dll
          # ueber transcribe-libs/ (tauri.windows.conf.json), keine Extra-Ressource.
          args: --features gpu-vulkan --bundles nsis,updater

      # Nachpacken: dieselbe EXE wie im Release (gleicher Tag, gleiche Features), ohne Bundle
      # und ohne Veroeffentlichung. Der Release-Text folgt erst nach erfolgreichem Upload.
      - name: Build executable for repack
        if: inputs.repack_tag != ''
        shell: bash
        env:
          # createUpdaterArtifacts ist gesetzt; ohne Schluessel koennte das CLI abbrechen.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pnpm tauri build --no-bundle --features gpu-vulkan

      # Portable Versionen (ZIP, ohne Installation). Packt die EXE, die tauri-action eben
      # gebaut hat; siehe scripts/build-portable-zip.ps1. continue-on-error: ein Fehler hier
      # darf weder das veroeffentlichte Release noch den SBOM-Upload danach verhindern; der
      # Schritt bleibt im Lauf als fehlgeschlagen sichtbar. Beim Nachpacken (repack_tag) sind
      # die ZIPs der einzige Zweck: dort bricht ein Fehler den Lauf ab.
      - name: Build portable ZIP
        continue-on-error: ${{ inputs.repack_tag == '' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'portable'
          ./scripts/build-portable-zip.ps1 -Release -SmokeTest -OutDir $out
          gh release upload "app-v${{ steps.version.outputs.version }}" (Get-ChildItem $out -File).FullName --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Offline-Variante: laedt die Modelle einmal ueber `--provision` (derselbe Weg wie die
      # Modellseite) und verteilt sie auf ZIPs unter 2 GiB (GitHub-Grenze je Datei).
      # HF_TOKEN (Repo-Secret) ist fuer das zugangsbeschraenkte deutsche Phonon-Modell noetig;
      # ohne ihn wird es mit Warnung ausgelassen. Arbeitsordner auf RUNNER_TEMP (Laufwerk D:),
      # weil C: fuer ~16 GB Zwischenstand zu knapp ist.
      - name: Build portable offline ZIPs
        continue-on-error: ${{ inputs.repack_tag == '' }}
        shell: pwsh
        run: |
          $env:TMP = $env:RUNNER_TEMP; $env:TEMP = $env:RUNNER_TEMP
          $out = Join-Path $env:RUNNER_TEMP 'portable-offline'
          # Ohne HF_TOKEN fehlt nur das deutsche Phonon-Modell (gated); alles andere ist
          # oeffentlich. Was drin ist, steht in INHALT.txt im ZIP und als Warnung im Lauf.
          ./scripts/build-portable-zip.ps1 -Release -Offline -SmokeTest -OutDir $out
          $tag = "app-v${{ steps.version.outputs.version }}"
          $new = @(Get-ChildItem $out -File)
          gh release upload $tag $new.FullName --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          # Aendert sich die Teilzahl beim Nachpacken, bleiben alte Teile (teilNvonM) sonst liegen.
          $assets = gh release view $tag --json assets --jq '.assets[].name' --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed" }
          foreach ($a in $assets) {
            if ($a -like '*_x64-portable-offline.*' -and ($new.Name -notcontains $a)) {
              Write-Host "Veraltetes Teil entfernen: $a"
              gh release delete-asset $tag $a --yes --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -ne 0) { throw "gh release delete-asset failed" }
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Nachpacken: Release-Text erst anpassen, wenn beide ZIP-Varianten hochgeladen sind.
      - name: Update release notes for repack
        if: inputs.repack_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "app-v${{ steps.version.outputs.version }}" --notes-file scripts/release-body.md --repo "$GITHUB_REPOSITORY"

      # Issue #7: SBOM (CycloneDX 1.5) and the licence notices ship with every
      # release. The notices file is the committed one (resources/, also inside
      # the installer; kept current by `gen-notices.mjs --check`). The SBOM is a
      # build artefact, so it is generated here. A failed SBOM must not undo the
      # release that tauri-action already published: continue-on-error, and the
      # upload below attaches whatever exists.
      - name: Generate SBOM
        continue-on-error: true
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked
          node scripts/gen-notices.mjs --only sbom

      - name: Attach SBOM and third-party notices to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILES=(src-tauri/resources/THIRD-PARTY-NOTICES.md)
          SBOM="src-tauri/target/sbom/local-voice-ai-${VERSION}.cdx.json"
          if [ -f "$SBOM" ]; then FILES+=("$SBOM"); else echo "::warning::SBOM $SBOM missing, uploading notices only"; fi
          gh release upload "app-v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
