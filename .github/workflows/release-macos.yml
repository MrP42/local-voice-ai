# macOS release (DMG) for Local Voice AI — Apple Silicon and Intel.
#
# Companion to release-windows.yml; see there for why root-level workflows are
# the only ones GitHub runs. Both trigger on the same `app-v*` tag and attach
# to the same release; tauri-action merges its platform entry into an existing
# latest.json, so the updater serves both platforms from one file. (A race is
# only possible if both jobs finish within seconds of each other.)
#
# Two architectures from one ARM runner: aarch64 natively, x86_64 as a
# cross-compile (--target x86_64-apple-darwin) — the same way the upstream
# Handy release built its Intel DMG after GitHub retired Intel runners.
# The app's GPU path on macOS is the ggml Metal backend, which Cargo.toml
# enables unconditionally for target_os = "macos" (transcribe-cpp feature
# "metal") — no build flag needed here. x86_64 additionally needs the pinned
# ONNX Runtime dylib (SSE2 baseline) bundled as a framework; aarch64 does not.
#
# max-parallel: 1 — both jobs attach to the same release and merge their
# platform into latest.json; running them serially rules out the write race.
#
# The DMG is ad-hoc signed (signingIdentity "-" in tauri.conf.json): no Apple
# Developer certificate or notarization. First launch needs right-click → Open.
name: "Release (macOS)"

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/local-voice

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Same guard as the Windows workflow: a tag must name the version the
      # app will report, or the updater compares against a phantom version.
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/app-v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag app-v$TAG does not match tauri.conf.json version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/local-voice/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ONNX Runtime for Intel Macs (mirrors the inherited Handy build.yml
      # step): Microsoft ships no osx-x86_64 asset for this version anymore,
      # so the tarball comes from upstream Handy's blob store — a third-party
      # host, hence the pinned SHA-256 (integrity anchor lives in this repo;
      # a swapped tarball fails the build instead of shipping in the DMG).
      # The versioned dylib must be bundled as a framework to satisfy the
      # @rpath install name.
      - name: Install ONNX Runtime (x86_64 only)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          ORT_VERSION="1.24.2"
          ORT_SHA256="590cee05699047b85e4a8115b4cec792073c2972ce78de383356a552a296a9c4"
          curl -fL -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          echo "${ORT_SHA256}  ort.tgz" | shasum -a 256 -c -
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" \
            '.bundle.macOS.frameworks = [$lib]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      # Not in git (gitignored *.onnx-class binaries); the app cannot compile
      # without it (see AGENTS.md, "Model Setup"). Third-party host → pinned
      # SHA-256, same rationale as the ONNX Runtime step above.
      - name: Fetch Silero VAD model
        shell: bash
        run: |
          VAD_SHA256="a35ebf52fd3ce5f1469b2a36158dba761bc47b973ea3382b3186ca15b1f5af28"
          mkdir -p src-tauri/resources/models
          curl -fL -o src-tauri/resources/models/silero_vad_v4.onnx \
            https://blob.handy.computer/silero_vad_v4.onnx
          echo "${VAD_SHA256}  src-tauri/resources/models/silero_vad_v4.onnx" | shasum -a 256 -c -

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same key as Windows; without it the bundler emits no .sig and the
          # app rejects every update it downloads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # whisper.cpp ships CMakeLists with a minimum too old for the
          # runner's CMake 4 (see AGENTS.md, macOS dev note).
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        with:
          projectPath: apps/local-voice
          tagName: app-v${{ steps.version.outputs.version }}
          releaseName: Local Voice AI ${{ steps.version.outputs.version }}
          releaseBody: "Automatischer Build (Windows + macOS). Die App aktualisiert sich hierauf selbst."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles app,dmg,updater
