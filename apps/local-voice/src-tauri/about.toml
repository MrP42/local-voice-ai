# cargo-about (Issue #7): erzeugt die Rust-Haelfte von THIRD-PARTY-NOTICES.
# Aufruf nur ueber apps/local-voice/scripts/gen-notices.mjs. cargo-about ist ein
# reines Entwicklerwerkzeug (MIT OR Apache-2.0), keine Laufzeitabhaengigkeit.
#
# WICHTIG: `accepted` ist hier keine Lizenzpolitik, sondern die Liste dessen, was
# im Verzeichnis AUFGEFUEHRT werden darf. Die Politik und das Gate ist deny.toml
# (`cargo deny check licenses`). Eine Lizenz, die hier steht, aber in deny.toml
# fehlt (LGPL-3.0, mp3lame-encoder), erscheint trotzdem im Verzeichnis - ein
# Verzeichnis, das einen Fund verschweigt, waere falsch.

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "LGPL-3.0",
]

# Ausgeliefert werden Windows (MSI/NSIS) und macOS; Linux-Pakete gibt es nicht.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Build-Abhaengigkeiten (Proc-Makros, build.rs) landen nicht im Binary, sind aber
# Teil der Lieferkette; sie bleiben im Verzeichnis, damit nichts fehlt.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# tauri-nspanel (macOS-Fensterplugin, Git-Abhaengigkeit ahkohd/tauri-nspanel) hat
# kein `license`-Feld im Manifest; das Repository liefert MIT und Apache-2.0 als
# Dateien. Die Pruefsummen gelten fuer den Commit da9c9a8 aus Cargo.lock; bei
# einem Wechsel des Commits neu bestimmen (sha256sum der beiden Dateien).
[tauri-nspanel.clarify]
license = "MIT OR Apache-2.0"

[[tauri-nspanel.clarify.files]]
path = "LICENSE_MIT"
license = "MIT"
checksum = "35e740d8a0d71739293b136b9f289c6b05f21ff6b0584b9b691dd5de5233d7e8"

[[tauri-nspanel.clarify.files]]
path = "LICENSE_APACHE-2.0"
license = "Apache-2.0"
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"
