# cargo-deny configuration.
#
# Codifies the licence policy verified in M0.1. Run with:
#   cargo deny --no-default-features check licenses
#   cargo deny --no-default-features check advisories
#
# Rationale for the allow list: every entry below was observed in the actual
# dependency graph for x86_64-pc-windows-msvc and is either permissive or
# file-level weak copyleft. No GPL/LGPL/AGPL crate is present on the Windows
# target — the LGPL hits that appear when scanning all targets at once come from
# Linux/macOS-only dependencies that are never linked into our build.

[licenses]
version = 2
confidence-threshold = 0.9

allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak, file-level copyleft. Obligations attach only to modified MPL files,
    # which we do not modify. Used by the symphonia audio decoders, cssparser and
    # selectors. Compatible with shipping our own code under a permissive licence.
    "MPL-2.0",
]

# Deliberately NOT allowed, so the build fails loudly if one ever appears:
# GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-*, SSPL, BUSL, Commons Clause, CC-BY-NC.

# Entscheidung Patrick 01.10.2026 (Issue #7/#11): LGPL-3.0 fuer den MP3-Export bewusst
# zugelassen. mp3lame-encoder 0.2.5 / mp3lame-sys 0.1.11 werden statisch gelinkt; beide
# stehen in THIRD-PARTY-NOTICES.md. Vor einer kommerziellen Weitergabe der App die
# LGPL-Pflichten (Austauschbarkeit der Bibliothek) klaeren.
exceptions = [
    { allow = ["LGPL-3.0"], crate = "mp3lame-encoder" },
    { allow = ["LGPL-3.0"], crate = "mp3lame-sys" },
]

[advisories]
version = 2
yanked = "warn"
# cargo-deny 0.20 turned `unmaintained` from a warn/deny lint level into a
# scope selector (which part of the graph gets checked), and now treats any
# advisory match that isn't in `ignore` below as a hard error regardless of
# type. "all" keeps checking the whole graph, matching the old default scope.
unmaintained = "all"

ignore = [
    # quick-xml DoS advisories, reached only through `plist`, which Tauri uses for
    # macOS Info.plist handling and build-time codegen. `plist 1.8.0` pins
    # quick-xml "^0.38", so the patched 0.41 cannot be selected without an
    # upstream release. Not reachable from our Windows runtime path, and both are
    # denial-of-service class requiring attacker-controlled XML input, which the
    # app never parses. Re-check when Tauri bumps plist.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- Issue #11 (Triage 01.10.2026): "unmaintained"-Hinweise ohne bekannte
    # Schwachstelle. Es gibt keine nutzbare Version (die Crates sind aufgegeben)
    # und ein Austausch liegt bei den Oberkrates. Jede Zeile: Weg im Graphen und
    # warum es hier hinnehmbar ist. Neu pruefen, wenn das Oberkrate wechselt.
    #
    # bincode 2.0.1 <- ferrous-opencc (Chinesisch-Konvertierung, Woerterbuecher).
    # Liest nur die eigenen, mitgebauten Woerterbuecher, keine fremden Eingaben.
    "RUSTSEC-2025-0141",
    # fxhash <- selectors <- kuchikiki <- tauri-utils. Nur Hash-Funktion im
    # HTML-Parser, den Tauri beim Bauen fuer das Frontend nutzt.
    "RUSTSEC-2025-0057",
    # gtk-layer-shell, gtk-layer-shell-sys, proc-macro-error (GTK3-Stack):
    # nur auf Linux (cfg(target_os = "linux")); im Windows-Graphen nicht vorhanden.
    "RUSTSEC-2024-0422",
    "RUSTSEC-2024-0423",
    "RUSTSEC-2024-0370",
    # paste <- specta =2.0.0-rc.22 (von tauri-specta rc.21 fest verlangt). Reines
    # Proc-Makro, laeuft nur beim Kompilieren.
    "RUSTSEC-2024-0436",
    # ttf-parser <- lopdf <- pdf-extract (Text aus PDF-Anhaengen). Aufgegeben, aber
    # ohne gemeldete Luecke; pdf-extract 0.12.1 haengt weiter daran.
    "RUSTSEC-2026-0192",
    # unic-* (fuenf Crates) <- unic-ucd-ident <- urlpattern <- tauri-utils.
    # Unicode-Tabellen fuer die Tauri-URL-Muster, keine Eingabe von aussen.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"   # upstream pins maintainer forks of rdev / vad-rs (see UPSTREAM.md)
