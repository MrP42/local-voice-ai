# Erzeugt von scripts/vendor-wai-suite.py aus https://github.com/MrP42/wai-sdk (crates/wai-notizbuch-zugang, Commit 40cc276de7f5). Nicht von Hand ändern.
[package]
name = "wai-notizbuch-zugang"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-WAI-Proprietary"
publish = false
description = "Nur lesender Zugang zur Notizbuch-Ablage für den Assistenten (lva#396 N0): Gliederung, Seitentext mit Blockzeiten, Volltextsuche, Abschnittsfreigabe, Eingangsvertrag v1"

[lib]
test = true
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
