# Erzeugt von scripts/vendor-wai-suite.py aus https://github.com/MrP42/wai-sdk (crates/wai-assistent, Commit 565ac40633ff). Nicht von Hand ändern.
[package]
name = "wai-assistent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-WAI-Proprietary"
publish = false
description = "Assistent-Kern (ADR-0028 A2): lokale Einstufung S0-S3 per Regeltabelle, Belegregel E4.2 und Messpunkte E9"

[lib]
test = false
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
