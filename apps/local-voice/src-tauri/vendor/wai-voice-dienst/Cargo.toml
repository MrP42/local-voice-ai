# Erzeugt von scripts/vendor-wai-voice-dienst.py aus https://github.com/MrP42/wai-sdk (crates/wai-voice-dienst, Commit a624d6900928). Nicht von Hand ändern.
[package]
name = "wai-voice-dienst"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-WAI-Proprietary"
publish = false
description = "Vertrag des Sprachdienstes (ADR-0021): Rahmen, Steuernachrichten, Grenzen, Rueckstau und Vorrang fuer Hoeren und Sprechen zwischen WAI-Apps und Local Voice AI"

[lib]
test = false
doctest = false

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
