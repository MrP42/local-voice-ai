# Erzeugt von scripts/vendor-wai-suite.py aus https://github.com/MrP42/wai-sdk (crates/wai-recherche, Commit 56533672647b). Nicht von Hand ändern.
[package]
name = "wai-recherche"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-WAI-Proprietary"
publish = false
description = "Recherche-Kern (ADR-0026 PR-3/PR-4): Suchanbieter, sicherer Abruf, Extraktion, Budget, Modus Schnell mit Belegpruefung"

[lib]
test = false
doctest = false

[dependencies]
wai-providers = { path = "../wai-providers", version = "0.1.0" }
wai-security = { path = "../wai-security", version = "0.1.0" }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
scraper = "0.29"
ego-tree = "0.11"
