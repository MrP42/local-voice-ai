# Erzeugt von scripts/vendor-wai-suite.py aus https://github.com/MrP42/wai-sdk (crates/wai-projekte, Commit 56533672647b). Nicht von Hand ändern.
[package]
name = "wai-projekte"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-WAI-Proprietary"
publish = false
description = "Suite-Projektverzeichnis (ADR-0026): Projekte und Eintraege als Verweise, SQLite, Mandant aus dem Principal"

[lib]
test = false
doctest = false

[dependencies]
wai-storage = { path = "../wai-storage", version = "0.1.0" }
wai-security = { path = "../wai-security", version = "0.1.0" }
wai-links = { path = "../wai-links", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
