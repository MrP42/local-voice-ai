# Erzeugt von scripts/vendor-wai-suite.py aus https://github.com/MrP42/wai-sdk (crates/wai-providers, Commit 56533672647b). Nicht von Hand ändern.
[package]
name = "wai-providers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-WAI-Proprietary"
publish = false
description = "SDK-05: Provider-Trait mit Capabilities, lokaler llama-server, Ollama-BYO, BYOK-API-Provider hinter dem Egress-Gate"

[lib]
test = false
doctest = false

[dependencies]
wai-security = { path = "../wai-security", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
