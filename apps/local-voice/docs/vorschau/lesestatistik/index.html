<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesestatistik – Vorschau lva#354</title>
<style>
:root{
  --bg:#f5f5f5;--surface:#fff;--surface2:#fafafa;--stroke:#e0e0e0;--stroke2:#d1d1d1;
  --text:#242424;--text2:#616161;--text3:#707070;--brand:#0f6cbd;--brandBg:#ebf3fc;--brandHover:#115ea3;
  --c-lesen:#0f6cbd;--c-hoeren:#0e7a0d;--c-vorlesen:#8764b8;--goal:#bc4b09;--ok:#0e7a0d;
  --heat0:#ebebeb;--heat1:#cfe4fa;--heat2:#96c6fa;--heat3:#479ef5;--heat4:#0f6cbd;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 0 2px rgba(0,0,0,.06);--ai:#8764b8;
}
[data-theme=dark]{
  --bg:#1f1f1f;--surface:#292929;--surface2:#2e2e2e;--stroke:#3d3d3d;--stroke2:#525252;
  --text:#fff;--text2:#d6d6d6;--text3:#adadad;--brand:#479ef5;--brandBg:#082338;--brandHover:#62abf5;
  --c-lesen:#479ef5;--c-hoeren:#54b054;--c-vorlesen:#b4a0ff;--goal:#f98845;--ok:#54b054;
  --heat0:#333;--heat1:#0e3a5f;--heat2:#115ea3;--heat3:#2886de;--heat4:#62abf5;
  --shadow:0 1px 2px rgba(0,0,0,.4);--ai:#b4a0ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:14px/20px "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:48px 1fr;height:100vh}
.rail{background:var(--surface2);border-right:1px solid var(--stroke);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
.rail i{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--text2)}
.rail i.on{background:var(--brandBg);color:var(--brand)}
.main{display:grid;grid-template-rows:48px 1fr;min-width:0}
.head{display:flex;align-items:baseline;gap:12px;padding:12px 24px 0;border-bottom:1px solid var(--stroke);background:var(--surface)}
.head h1{font-size:20px;line-height:28px;font-weight:600;margin:0}
.head small{color:var(--text2);font-size:12px}
.scroll{overflow:auto;padding:16px 24px 32px}
svg{display:block}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 12px;border:1px solid var(--stroke2);border-radius:4px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn.sub{border-color:transparent;background:transparent}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme=dark] .btn.primary{color:#000}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 260px;max-width:420px;height:32px;border:1px solid var(--stroke2);border-bottom-color:var(--text2);border-radius:4px;background:var(--surface);display:flex;align-items:center;padding:0 10px;color:var(--text3);gap:6px}
.spacer{flex:1}
.goalchip{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:3px 12px 3px 6px;border:1px solid var(--stroke2);border-radius:16px;background:var(--surface);cursor:pointer}
.goalchip b{font-weight:600}
.goalchip span{color:var(--text2)}
.goalchip.focus{outline:2px solid var(--text);outline-offset:1px}
.chips{display:flex;gap:4px}
.chip{border:1px solid var(--stroke);border-radius:16px;padding:4px 10px;background:var(--surface);font-size:12px}
.chip[aria-pressed=true]{background:var(--brandBg);border-color:var(--brand);color:var(--brand)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:10px}
.cover{aspect-ratio:2/3;border-radius:4px;display:grid;place-items:end start;padding:10px;color:#fff;font-weight:600;font-size:15px;line-height:19px}
.card h3{font-size:14px;margin:8px 0 2px;font-weight:600}
.meta{color:var(--text2);font-size:12px;line-height:16px}
/* Statistik */
.back{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back h2{font-size:20px;line-height:28px;margin:0;font-weight:600}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1280px){.grid.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media (min-width:1920px){.grid.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}}
.panel{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:16px;min-width:0}
.panel h3{font-size:16px;line-height:22px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h3 .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--text2)}
.today{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.today .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.k{padding:8px 12px;border-left:3px solid var(--stroke)}
.k b{display:block;font-size:20px;line-height:28px;font-weight:600}
.k span{color:var(--text2);font-size:12px}
.k.ok{border-left-color:var(--ok)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 16px}
.seg{display:inline-flex;border:1px solid var(--stroke2);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 14px;min-height:32px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
[data-theme=dark] .seg button[aria-pressed=true]{color:#000}
.period strong{font-size:16px;font-weight:600;min-width:150px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.tile{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:12px 16px}
.tile span{color:var(--text2);font-size:12px;display:block}
.tile b{font-size:24px;line-height:32px;font-weight:600}
.tile small{color:var(--text2);font-size:12px;margin-left:4px}
.tile em{display:block;font-style:normal;font-size:12px;color:var(--text2)}
.tile em .up{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hb .t{height:10px;border-radius:5px;background:var(--heat0);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.hb .v{text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.topic{border:1px solid var(--stroke);border-radius:14px;padding:3px 10px;font-size:12px;background:var(--surface2)}
.topic b{font-weight:600;margin-left:4px;color:var(--text2)}
table.books{width:100%;border-collapse:collapse}
.books td,.books th{padding:8px;border-bottom:1px solid var(--stroke);text-align:left;font-size:13px;vertical-align:middle}
.books th{color:var(--text2);font-weight:400;font-size:12px}
.books .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:30px;height:44px;border-radius:3px;display:inline-block;vertical-align:middle}
.fm{display:inline-flex;gap:4px}
.fm i{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;color:#fff}
.fm i svg{width:12px;height:12px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--surface2);border:1px solid var(--stroke);color:var(--text2);white-space:nowrap}
.pill.done{color:var(--ok);border-color:var(--ok)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;color:var(--text2);font-size:12px}
.foot .lock{display:flex;gap:6px;align-items:center;flex:1 1 320px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(9px,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{aspect-ratio:1;max-height:22px;border-radius:2px;background:var(--heat0);position:relative}
.heat i.g::after{content:"";position:absolute;inset:35%;border-radius:50%;background:var(--surface)}
.months{display:flex;justify-content:space-between;color:var(--text2);font-size:11px;margin-bottom:4px}
/* Popover */
.pop{position:absolute;background:var(--surface);border-radius:8px;box-shadow:0 8px 16px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);padding:16px;width:320px;z-index:5;border:1px solid var(--stroke)}
.pop h4{margin:0 0 8px;font-size:14px;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.steps button{min-width:44px;min-height:32px;border:1px solid var(--stroke2);border-radius:4px;background:var(--surface);cursor:pointer}
.steps button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
[data-theme=dark] .steps button[aria-pressed=true]{color:#000}
.days{display:flex;gap:4px;margin:8px 0 12px}
.days button{width:36px;height:36px;border-radius:18px;border:1px solid var(--stroke2);background:var(--surface)}
.days button[aria-pressed=true]{background:var(--brandBg);border-color:var(--brand);color:var(--brand);font-weight:600}
/* Buchansicht */
.detail{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.detail .cover{width:200px}
.detail h2{font-size:24px;line-height:32px;margin:0;font-weight:600}
.row{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;margin-top:16px;align-items:start}
.row > span{color:var(--text2);padding-top:6px}
.sel{display:inline-flex;align-items:center;gap:8px;min-height:32px;border:1px solid var(--stroke2);border-bottom-color:var(--text2);border-radius:4px;padding:0 10px;background:var(--surface);min-width:260px;justify-content:space-between}
.ai{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ai);border:1px solid var(--ai);border-radius:10px;padding:0 6px;line-height:18px}
.suggest{border:1px dashed var(--ai);border-radius:8px;padding:12px;margin-top:8px;background:color-mix(in srgb,var(--ai) 6%,var(--surface))}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stroke2);border-radius:14px;padding:3px 6px 3px 10px;font-size:12px;background:var(--surface);margin:0 4px 4px 0}
.tchip.add{border-style:dashed;color:var(--text2);padding-right:10px}
.readline{display:flex;gap:8px;align-items:center;margin-top:16px;padding:10px 12px;border-radius:6px;background:var(--surface2);border:1px solid var(--stroke)}
.readline a{color:var(--brand);text-decoration:none;margin-left:auto}
.privacy{font-size:12px;color:var(--text2);margin-top:6px}
/* Mobil */
@media (max-width:640px){
  .app{grid-template-columns:1fr}.rail{display:none}
  .head{padding:12px 16px 0}.scroll{padding:12px 16px 24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile b{font-size:20px;line-height:28px}
  .today{grid-template-columns:1fr;justify-items:center}
  .today .kpis{grid-template-columns:repeat(2,1fr);width:100%}
  .hb{grid-template-columns:1fr 64px;gap:2px 8px;margin:10px 0}.hb .n{grid-column:1/-1;white-space:normal}
  .period{gap:4px}.period .seg{flex:1 1 100%}.period .seg button{flex:1}
  .books .hide-s{display:none}
  .detail{grid-template-columns:1fr}.detail .cover{width:140px}
  .row{grid-template-columns:1fr}.row>span{padding-top:0}
  .sel{min-width:0;width:100%}
  .search{flex-basis:100%;max-width:none}
  .goalchip.compact{width:44px;height:44px;padding:0;justify-content:center;border-radius:22px}
  .goalchip.compact b,.goalchip.compact span{display:none}
  .period strong{min-width:0;flex:1}
  .pop{left:16px!important;right:16px;width:auto}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .btn{min-height:44px}.seg button{min-height:44px}
}
</style>
</head>

  <nav class="rail" aria-label="Navigation">

  <div class="main">

</div>
<script>
const P=new URLSearchParams(location.search);
document.documentElement.dataset.theme=P.get('theme')||'light';
const VIEW=P.get('view')||'stats';
const MOBILE=innerWidth<=640;
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ICON={
 lesen:'<svg viewBox="0 0 16 16" class="ic"><path d="M2 3.5c2-.8 4-.8 6 .5 2-1.3 4-1.3 6-.5v9c-2-.8-4-.8-6 .5-2-1.3-4-1.3-6-.5zM8 4v9"/></svg>',
 hoeren:'<svg viewBox="0 0 16 16" class="ic"><path d="M3 10V8a5 5 0 0 1 10 0v2M3 10h2v4H3zM11 10h2v4h-2z"/></svg>',
 vorlesen:'<svg viewBox="0 0 16 16" class="ic"><path d="M3 6h2l3-3v10L5 10H3zM11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4"/></svg>',
 chart:'<svg viewBox="0 0 16 16" class="ic"><path d="M2 14h12M4 12V8M7 12V4M10 12V7M13 12V5"/></svg>',
 back:'<svg viewBox="0 0 16 16" class="ic"><path d="M10 3 5 8l5 5"/></svg>',
 l:'<svg viewBox="0 0 16 16" class="ic"><path d="M10 3 5 8l5 5"/></svg>',
 r:'<svg viewBox="0 0 16 16" class="ic"><path d="m6 3 5 5-5 5"/></svg>',
 lock:'<svg viewBox="0 0 16 16" class="ic"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
 dl:'<svg viewBox="0 0 16 16" class="ic"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg>',
 del:'<svg viewBox="0 0 16 16" class="ic"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.7 9h5.6l.7-9"/></svg>',
 pause:'<svg viewBox="0 0 16 16" class="ic"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg>',
 fire:'<svg viewBox="0 0 16 16" class="ic"><path d="M8 14c2.8 0 4.5-1.8 4.5-4.3C12.5 6.5 9 5 9 2c-2 1-3.5 3.4-3 5.5-1-.4-1.5-1.3-1.6-2C3.6 6.5 3.5 8 3.5 9.7 3.5 12.2 5.2 14 8 14z"/></svg>',
 spark:'<svg viewBox="0 0 16 16" class="ic"><path d="M8 2l1.3 3.7L13 7l-3.7 1.3L8 12l-1.3-3.7L3 7l3.7-1.3zM12.5 11.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/></svg>',
 x:'<svg viewBox="0 0 16 16" class="ic" style="width:12px;height:12px"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
 down:'<svg viewBox="0 0 16 16" class="ic"><path d="m4 6 4 4 4-4"/></svg>',
 table:'<svg viewBox="0 0 16 16" class="ic"><rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M2.5 6.5h11M2.5 10h11M6.5 3v10"/></svg>',
};
// Synthetische Bücher (nur Vorschau)
const BOOKS=[
 {t:'Die Kunst der freien Rede',a:'M. Berger',cat:'Kommunikation & Rhetorik',col:'#2b5f8a',min:412,pg:186,fm:['hoeren','lesen'],lang:'Deutsch',st:'beendet'},
 {t:'Führen ohne Hierarchie',a:'S. Lang',cat:'Führung & Management',col:'#7a4b2b',min:298,pg:124,fm:['hoeren'],lang:'Deutsch',st:'64 %'},
 {t:'Deep Work Habits',a:'C. Newman',cat:'Persönlichkeitsentwicklung',col:'#3d6b4a',min:236,pg:97,fm:['lesen','vorlesen'],lang:'Englisch',st:'48 %'},
 {t:'Verwaltung digital gestalten',a:'K. Roth',cat:'Fachbuch (Beruf, Recht, Verwaltung)',col:'#4b4f7a',min:181,pg:142,fm:['lesen'],lang:'Deutsch',st:'71 %'},
 {t:'Agenten und Sprachmodelle',a:'T. Weiß',cat:'Technik, IT & KI',col:'#1f6f78',min:154,pg:88,fm:['vorlesen','lesen'],lang:'Deutsch',st:'35 %'},
 {t:'Das Leuchten im Nebel',a:'A. Sommer',cat:'Roman & Erzählung',col:'#8a2b4f',min:96,pg:0,fm:['hoeren'],lang:'Deutsch',st:'22 %'},
 {t:'The Calm Mind',a:'J. Reyes',cat:'Psychologie',col:'#6b5a2b',min:72,pg:31,fm:['hoeren'],lang:'Englisch',st:'18 %'},
];
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h} h ${String(r).padStart(2,'0')} Min.`:`${r} Min.`};
const fmtS=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h}:${String(r).padStart(2,'0')} h`:`${r} Min.`};
// Tageswerte November (1–30), heute = 6.
function seeded(i){const x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x)}
const DAYS=Array.from({length:30},(_,i)=>{const d=i+1;if(d>6)return null;const base=[38,52,0,41,27,18][i];return{l:Math.round(base*.35),h:Math.round(base*.5),v:Math.round(base*.15)}});
const OCT=Array.from({length:31},(_,i)=>{const s=seeded(i+3);const tot=s<.12?0:Math.round(15+s*55);return{l:Math.round(tot*.38),h:Math.round(tot*.47),v:tot-Math.round(tot*.38)-Math.round(tot*.47)}});
const GOAL=30;
const OCT_TOT=OCT.reduce((a,d)=>a+d.l+d.h+d.v,0);
{const raw=BOOKS.reduce((a,b)=>a+b.min,0);BOOKS.forEach(b=>{b.min=Math.round(b.min*OCT_TOT/raw);b.pg=Math.round(b.pg*OCT_TOT/raw)})}
const OCT_AVG=Math.round(OCT_TOT/31);const OCT_GOAL=OCT.filter(d=>d.l+d.h+d.v>=30).length;
function ring(val,goal,size=112,stroke=10,label=true){
 const r=(size-stroke)/2,c=2*Math.PI*r,p=Math.min(1,val/goal);
 const done=val>=goal;
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Heute ${val} von ${goal} Minuten">
 <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--heat0)" stroke-width="${stroke}"/>
 <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${done?'var(--ok)':'var(--brand)'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
 ${label?`<text x="50%" y="46%" text-anchor="middle" font-size="22" font-weight="600" fill="var(--text)">${val}</text><text x="50%" y="64%" text-anchor="middle" font-size="11" fill="var(--text2)">von ${goal} Min.</text>`:''}</svg>`;
}
function chips(){return `<div class="chips">${['Alle 24','Lesen 9','Hören 12','In Arbeit 6'].map((c,i)=>`<button class="chip" aria-pressed="${i==0}">${c}</button>`).join('')}</div>`}
function libBar(focus){
 const today=18;
 return `<div class="bar"><div class="search">⌕ Bibliothek durchsuchen</div><span class="spacer"></span>
 <button class="goalchip ${MOBILE?'compact':''} ${focus?'focus':''}" aria-label="Lesestatistik öffnen – heute 18 von 30 Minuten" title="Lesestatistik – heute 18 von 30 Minuten">${ring(today,GOAL,24,4,false)}<b>18</b><span>/ 30 Min. heute</span></button>
 <button class="btn">☑ Auswählen</button><button class="btn">Zuletzt gelesen ${ICON.down}</button>${MOBILE?'':chips()}</div>${MOBILE?chips():''}`;
}
function viewBar(){
 const cards=BOOKS.slice(0,MOBILE?4:6).map(b=>`<div class="card"><div class="cover" style="background:linear-gradient(160deg,${b.col},#111)">${b.t}</div><h3>${b.t}</h3><div class="meta">${b.a} · ${b.st}</div></div>`).join('');
 return libBar(true)+`<h3 style="font-size:16px;margin:8px 0 12px">Weitermachen</h3><div class="cards">${cards}</div>`;
}
function stackBars(data,{w,h,goal,avg,labelsEvery=1,today=-1,xl}){
 const pad={l:30,r:8,t:10,b:22};const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;const max=Math.max(60,...data.map(d=>d?d.l+d.h+d.v:0));
 const y=v=>pad.t+ih-v/max*ih;const bw=iw/data.length;
 let s=`<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="Lesezeit je Tag, gestapelt nach Format">`;
 [0,30,60,90].filter(v=>v<=max).forEach(v=>{s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--stroke)"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--text3)">${v}</text>`});
 data.forEach((d,i)=>{const x=pad.l+i*bw+bw*.18,bW=bw*.64;let acc=0;
  if(d){[['l','--c-lesen'],['h','--c-hoeren'],['v','--c-vorlesen']].forEach(([k,c])=>{if(!d[k])return;const top=y(acc+d[k]),bot=y(acc);s+=`<rect x="${x}" y="${top}" width="${bW}" height="${Math.max(0,bot-top-1)}" fill="var(${c})" rx="2"/>`;acc+=d[k]});
   if(acc>=goal)s+=`<circle cx="${x+bW/2}" cy="${y(acc)-6}" r="2.5" fill="var(--ok)"/>`;}
  if(i%labelsEvery==0||i==today)s+=`<text x="${x+bW/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="${i==today?'var(--text)':'var(--text3)'}" font-weight="${i==today?600:400}">${xl?xl(i):i+1}</text>`;
 });
 s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--goal)" stroke-dasharray="5 4" stroke-width="1.5"/><rect x="${pad.l+2}" y="${y(goal)-15}" width="62" height="13" rx="2" fill="var(--surface)" opacity=".85"/><text x="${pad.l+6}" y="${y(goal)-5}" font-size="10" font-weight="600" fill="var(--goal)">Ziel ${goal} Min.</text>`;
 if(avg)s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--text2)" stroke-dasharray="2 3"/><text x="${w-pad.r}" y="${y(avg)+(avg>goal?-4:12)}" text-anchor="end" font-size="10" fill="var(--text2)">Ø ${avg} Min.</text>`;
 return s+'</svg>';
}
const legend=`<div class="legend"><span><i style="background:var(--c-lesen)"></i>Lesen</span><span><i style="background:var(--c-hoeren)"></i>Hören</span><span><i style="background:var(--c-vorlesen)"></i>Vorlesen</span><span><i style="background:var(--ok);border-radius:50%"></i>Ziel erreicht</span></div>`;
function todayPanel(){
 return `<section class="panel" aria-labelledby="h-today"><h3 id="h-today">Heute & Ziel<button class="btn sub r" id="goalbtn" style="margin-left:auto">Ziel ändern</button></h3>
 <div class="today">${ring(18,GOAL)}
 <div class="kpis">
  <div class="k"><b>12 Min.</b><span>noch bis zum Ziel</span></div>
  <div class="k ok"><b>${ICON.fire} 4 Tage</b><span>Serie (Ziel erreicht)</span></div>
  <div class="k"><b>31 Min.</b><span>Ø je Tag, 7 Tage</span></div>
  <div class="k"><b>${OCT_AVG} Min.</b><span>Ø je Tag, 30 Tage</span></div>
  <div class="k"><b>${OCT_GOAL} / 31</b><span>Tage mit Ziel im Oktober</span></div>
 </div></div></section>`;
}
function periodBar(mode){
 const label={week:'2.–8. November 2026',month:'Oktober 2026',year:'2026'}[mode];
 return `<div class="period"><div class="seg" role="group" aria-label="Zeitraum">${[['week','Woche'],['month','Monat'],['year','Jahr']].map(([k,l])=>`<button aria-pressed="${k==mode}">${l}</button>`).join('')}</div>
 <button class="btn sub" aria-label="Zurück">${ICON.l}</button><strong>${label}</strong><button class="btn sub" aria-label="Weiter">${ICON.r}</button><button class="btn">Heute</button></div>`;
}
function tiles(mode){
 const t=mode=='year'?[['Zeit','214','h','+18 % zum Vorjahr'],['Seiten','11.480','','Buchseiten, z. T. geschätzt'],['Bücher','41','','davon 19 Hörbücher'],['Beendet','23','','Ø 15 Tage je Buch']]
  :[['Zeit',fmtS(OCT_TOT).replace(' h',''),'h','<span class="up">▲ 12 %</span> zum September'],['Seiten',String(BOOKS.reduce((a,b)=>a+b.pg,0)),'','Buchseiten, z. T. geschätzt'],['Bücher','7',''],['Beendet','1','','Die Kunst der freien Rede']];
 if(mode!='year')t[2][3]='davon 4 Hörbücher';
 return `<div class="tiles">${t.map(([a,b,c,d])=>`<div class="tile"><span>${a}</span><b>${b}</b><small>${c}</small><em>${d}</em></div>`).join('')}</div>`;
}
function verlauf(mode){
 const w=MOBILE?360:820,h=MOBILE?190:300;
 let data,opts;
 if(mode=='year'){data=Array.from({length:52},(_,i)=>{if(i>44)return null;const s=seeded(i+7);const t=Math.round(25+s*30);return{l:Math.round(t*.4),h:Math.round(t*.45),v:t-Math.round(t*.4)-Math.round(t*.45)}});opts={goal:30,avg:36,labelsEvery:MOBILE?13:4,xl:i=>'KW '+(i+1)}}
 else{data=OCT;opts={goal:30,avg:OCT_AVG,labelsEvery:MOBILE?5:1}}
 return `<section class="panel"><h3>Verlauf<span class="r">${mode=='year'?'Ø Minuten je Tag, je Kalenderwoche':'Minuten je Tag'}</span><button class="btn sub" aria-label="Als Tabelle">${ICON.table}</button></h3>${stackBars(data,{w,h,...opts})}${legend}</section>`;
}
function schwerpunkte(mode){
 const k=mode=='year'?[['Persönlichkeitsentwicklung',58],['Führung & Management',41],['Kommunikation & Rhetorik',33],['Technik, IT & KI',29],['Fachbuch (Beruf, Recht, Verwaltung)',22],['Roman & Erzählung',18],['Psychologie',13]]
  :BOOKS.map(b=>[b.cat,b.min]);
 const tot=k.reduce((a,b)=>a+b[1],0),mx=k[0][1];
 const topics=mode=='year'?[['Führung',2840],['Rhetorik',2210],['Gewohnheiten',1650],['Sprachmodelle',1420],['Verwaltungsdigitalisierung',1230],['Verhandeln',840],['Achtsamkeit',610]]
  :[['Rhetorik',BOOKS[0].min],['Führung',BOOKS[1].min],['Konzentration',BOOKS[2].min],['Verwaltungsdigitalisierung',BOOKS[3].min],['Sprachmodelle',BOOKS[4].min],['Stimme & Atem',Math.round(BOOKS[0].min*.4)],['Gewohnheiten',Math.round(BOOKS[2].min*.5)]];
 return `<section class="panel"><h3>Schwerpunkte<span class="r">Anteil der Zeit</span></h3>
 ${k.map(([n,v])=>`<div class="hb"><span class="n" title="${n}">${n}</span><span class="t"><i style="width:${v/mx*100}%"></i></span><span class="v">${Math.round(v/tot*100)} %</span></div>`).join('')}
 <div class="meta" style="margin-top:12px">Themen</div>
 <div class="topics">${topics.map(([n,v])=>`<button class="topic">${n}<b>${fmtS(mode=='year'?v:v)}</b></button>`).join('')}</div>
 <div class="meta" style="margin-top:10px">Sachbuch 86 % · Belletristik 14 %</div></section>`;
}
function sprachen(mode){
 const en=BOOKS.filter(b=>b.lang=='Englisch').reduce((a,b)=>a+b.min,0);const s=mode=='year'?[['Deutsch',171],['Englisch',39],['Französisch',4]]:[['Deutsch',OCT_TOT-en],['Englisch',en]];
 const tot=s.reduce((a,b)=>a+b[1],0);
 return `<section class="panel"><h3>Sprachen</h3>${s.map(([n,v])=>`<div class="hb"><span class="n">${n}</span><span class="t"><i style="width:${v/tot*100}%;background:var(--c-hoeren)"></i></span><span class="v">${mode=='year'?v+' h':fmtS(v)}</span></div>`).join('')}
 <div class="meta" style="margin-top:8px">${mode=='year'?'Englisch: 18 % der Zeit, vor allem Hören':`Englisch: ${Math.round(en/OCT_TOT*100)} % der Zeit, überwiegend Hören`}</div></section>`;
}
function bookList(){
 const fc={lesen:'--c-lesen',hoeren:'--c-hoeren',vorlesen:'--c-vorlesen'};
 const fl={lesen:'Lesen',hoeren:'Hören',vorlesen:'Vorlesen'};
 return `<section class="panel"><h3>Bücher im Zeitraum<span class="r">sortiert nach Zeit</span></h3><table class="books"><thead><tr><th></th><th>Buch</th><th class="hide-s">Kategorie</th><th>Formate</th><th class="num">Zeit</th><th class="num hide-s">Seiten</th><th class="hide-s">Stand</th></tr></thead><tbody>
 ${BOOKS.map(b=>`<tr><td style="width:40px"><span class="mini" style="background:linear-gradient(160deg,${b.col},#111)"></span></td><td><strong style="font-weight:600">${b.t}</strong><div class="meta">${b.a} · ${b.lang}</div></td><td class="hide-s">${b.cat}</td><td><span class="fm">${b.fm.map(f=>`<i style="background:var(${fc[f]})" title="${fl[f]}" aria-label="${fl[f]}">${ICON[f]}</i>`).join('')}</span></td><td class="num">${fmtS(b.min)}</td><td class="num hide-s">${b.pg?b.pg:'–'}</td><td class="hide-s"><span class="pill ${b.st=='beendet'?'done':''}">${b.st}</span></td></tr>`).join('')}
 </tbody></table><div class="meta" style="margin-top:8px">„–“: Hörbuch ohne bekannte Seitenzahl, nur Zeit.</div></section>`;
}
function jahr(){
 let cells='';const start=new Date(2026,0,1);const off=(start.getDay()+6)%7;
 for(let i=0;i<off;i++)cells+='<i style="visibility:hidden"></i>';
 for(let d=0;d<365;d++){const dt=new Date(2026,0,1+d);const future=dt>new Date(2026,10,6);const s=seeded(d+1);const m=future?-1:(s<.14?0:Math.round(10+s*70));
  const lvl=m<0?0:m==0?0:m<20?1:m<30?2:m<50?3:4;cells+=`<i style="background:var(--heat${lvl});${future?'opacity:.35':''}" class="${m>=30?'g':''}" title="${dt.toLocaleDateString('de-DE')}: ${m<0?'–':m+' Min.'}"></i>`;}
 const months='Jan Feb Mär Apr Mai Jun Jul Aug Sep Okt Nov Dez'.split(' ');
 return `<section class="panel"><h3>Jahr 2026<span class="r">Minuten je Tag · Punkt = Ziel erreicht</span></h3><div class="months">${months.map(m=>`<span>${m}</span>`).join('')}</div><div class="heat">${cells}</div>
 <div class="legend">weniger <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> mehr · Ziel an 231 von 310 Tagen erreicht · längste Serie 23 Tage</div></section>`;
}
function foot(){
 return `<div class="foot"><span class="lock">${ICON.lock}Nur auf deinen Geräten gespeichert und Ende-zu-Ende verschlüsselt zwischen ihnen abgeglichen. Für die Einordnung gehen nur Titel und Klappentext an das gewählte Modell, nie deine Lesezeiten.</span>
 <button class="btn">${ICON.dl} Exportieren (CSV)</button><button class="btn">${ICON.pause} Erfassung pausieren</button><button class="btn">${ICON.del} Statistik löschen …</button></div>`;
}
function viewStats(mode){
 $('#sub').textContent='Lesestatistik';
 const head=`<div class="back"><button class="btn sub" aria-label="Zurück zur Bibliothek">${ICON.back}</button><h2>Lesestatistik</h2></div>`;
 if(mode=='empty')return head+`<section class="panel" style="max-width:640px"><h3>${ICON.chart} Noch nichts erfasst</h3><p style="margin:0 0 12px;color:var(--text2)">Sobald du in der Bibliothek liest, hörst oder vorlesen lässt, erscheinen hier Zeit, Seiten, Themen und Sprachen je Tag, Monat und Jahr. Ein Tagesziel zeigt dir, wann du dein Pensum erreicht hast.</p><button class="btn primary">Ziel festlegen</button> <button class="btn sub">Ohne Ziel weiter</button></section>`+foot();
 const two=`<div class="grid two">${verlauf(mode)}${schwerpunkte(mode)}${MOBILE||innerWidth<1920?'':sprachen(mode)}</div>`;
 const rest=`<div class="grid two" style="margin-top:16px">${bookList()}${MOBILE||innerWidth>=1920?'':sprachen(mode)}</div>`;
 const restM=MOBILE?`<div class="grid" style="margin-top:16px">${sprachen(mode)}${bookList()}</div>`:rest;
 return head+todayPanel()+periodBar(mode)+tiles(mode)+two+restM+(mode=='year'?`<div style="margin-top:16px">${jahr()}</div>`:'')+foot();
}
function viewBook(){
 $('#sub').textContent='Buch';
 const b=BOOKS[1];
 return `<div class="back"><button class="btn sub" aria-label="Zurück">${ICON.back}</button><span class="meta">Bibliothek</span></div>
 <div class="detail"><div class="cover" style="background:linear-gradient(160deg,${b.col},#111);aspect-ratio:2/3">${b.t}</div>
 <div><h2>${b.t}</h2><div class="meta" style="font-size:14px">${b.a} · Deutsch · 312 Seiten · Hörbuch 7 h 48 Min.</div>
 <div class="row"><span>Kategorie</span><div><span class="sel">Führung &amp; Management ${ICON.down}</span> <span class="ai">${ICON.spark} KI-Vorschlag</span>
  <div class="suggest"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong style="font-weight:600">Vorschlag:</strong> Führung &amp; Management · Themen: Führung, Verhandeln, Teamarbeit
   <span style="margin-left:auto;display:flex;gap:6px"><button class="btn primary">Übernehmen</button><button class="btn">Ändern</button></span></div>
   <div class="privacy">Eingeordnet mit „Gemma 3 (lokal)“ aus Titel, Autor und Klappentext.</div></div></div>
 <span>Themen</span><div><span class="tchip">Führung <button class="btn sub" style="min-height:20px;padding:0" aria-label="Thema Führung entfernen">${ICON.x}</button></span><span class="tchip">Verhandeln <button class="btn sub" style="min-height:20px;padding:0" aria-label="Thema Verhandeln entfernen">${ICON.x}</button></span><span class="tchip">Teamarbeit <button class="btn sub" style="min-height:20px;padding:0" aria-label="Thema Teamarbeit entfernen">${ICON.x}</button></span><span class="tchip add">+ Thema</span></div>
 </div>
 <div class="readline">${ICON.chart}<span><strong style="font-weight:600">4 h 58 Min.</strong> gehört · ca. 124 Seiten · zuletzt heute · an 9 Tagen</span><a href="#">In der Statistik ansehen</a></div>
 </div></div>`;
}
function goalPop(){
 const btn=$('#goalbtn');const r=btn.getBoundingClientRect();const pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Leseziel');
 pop.style.top=(r.bottom+6)+'px';pop.style.left=Math.max(16,r.right-320)+'px';
 pop.innerHTML=`<h4>Tägliches Leseziel</h4><div class="meta">Zählt Lesen, Hören und Vorlesen zusammen.</div>
 <div class="steps">${[0,10,15,20,30,45,60,90,120].map(m=>`<button aria-pressed="${m==30}">${m?m:'Aus'}</button>`).join('')}</div>
 <div class="meta">Minuten am Tag · an diesen Tagen</div><div class="days">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<button aria-pressed="true">${d}</button>`).join('')}</div>
 <label class="meta" style="display:flex;gap:8px;align-items:center"><input type="checkbox"> Zusätzlich Seitenziel: <strong>20</strong> Seiten</label>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn">Abbrechen</button><button class="btn primary">Speichern</button></div>`;
 document.body.appendChild(pop);
}
const root=$('#root');
if(VIEW=='bar')root.innerHTML=viewBar();
else if(VIEW=='book')root.innerHTML=viewBook();
else root.innerHTML=viewStats(VIEW=='year'?'year':VIEW=='empty'?'empty':'month');
if(VIEW=='goal')goalPop();
</script>
</body>
</html>
