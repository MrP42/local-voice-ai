<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufnahmen Prototyp</title>
<!-- Klick-Prototyp U1 (Goal aufnahmen-ui, #64). Reines HTML/CSS/JS, keine externen Ressourcen.
     Farben und Masse aus apps/local-voice/src/styles/theme.css und App.css (Wurzel 15 px,
     text-xs 11,25 px, text-sm 13,125 px, IconAction 36 px, TabList, .mbtn, ResizeHandle). -->
<style>
:root{--p-ink:#111418;--p-chrome:#1a1d22;--p-chrome-text:#e9eaec}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:#d9dce1;color:#1f2937;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* ---------- Prototyp-Rahmen (nicht Teil der App) ---------- */
.pbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--p-chrome);color:var(--p-chrome-text);font-size:13px;white-space:nowrap;overflow-x:auto}
.pbar b{font-weight:600}
.pseg{display:inline-flex;border:1px solid #3a3f47;border-radius:8px;overflow:hidden}
.pseg button{background:transparent;border:0;color:#c9ccd1;padding:5px 10px;font-size:12.5px}
.pseg button[aria-pressed=true]{background:#ffdd00;color:#111418;font-weight:600}
.pbar .sep{width:1px;height:24px;background:#3a3f47}
.pinfo{font-size:12px;color:#aab0b8}
.pcheck{font-size:12px;padding:3px 8px;border-radius:999px;background:#23462e;color:#b8f0c6}
.pcheck.bad{background:#5a2323;color:#ffd0d0}
.pbtn{background:transparent;border:1px solid #3a3f47;color:#c9ccd1;border-radius:8px;padding:5px 10px;font-size:12.5px}
.pdesc{height:26px;display:flex;align-items:center;padding:0 12px;font-size:12px;background:#262a31;color:#c9ccd1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:absolute;top:74px;left:0;right:0;bottom:0;overflow:hidden}
#holder{position:absolute}
#frame{position:absolute;top:0;left:0;transform-origin:0 0;box-shadow:0 8px 40px rgba(0,0,0,.25);border-radius:8px;overflow:hidden}
/* ---------- App-Tokens (theme.css) ---------- */
#frame{--text:#1f2937;--bg:#f8f9fb;--mid:#808080;--yellow:#ffdd00;--ink:#111418;
  --line:color-mix(in srgb,var(--mid) 22%,transparent);--fill:color-mix(in srgb,var(--mid) 10%,transparent);
  --hover:color-mix(in srgb,var(--mid) 15%,transparent);--muted:color-mix(in srgb,var(--text) 65%,transparent);
  --faint:color-mix(in srgb,var(--text) 55%,transparent);--sel:color-mix(in srgb,var(--yellow) 22%,transparent);
  --ok:#15803d;--okbg:rgba(34,197,94,.16);--red:#dc2626;--redbg:rgba(220,38,38,.1);--card:var(--bg);
  --shadow:0 10px 30px rgba(17,20,24,.16);
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
#frame[data-theme=dark]{--text:#edede7;--bg:#0b0b0c;--ok:#4ade80;--okbg:rgba(74,222,128,.14);--red:#f87171;--redbg:rgba(248,113,113,.13);--card:#111214;--shadow:0 10px 30px rgba(0,0,0,.6)}
#frame ::-webkit-scrollbar{width:14px;height:14px}
#frame ::-webkit-scrollbar-track{background:transparent}
#frame ::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--text),transparent 85%);border-radius:20px;border:3px solid transparent;border-right-width:4px;background-clip:content-box;min-height:32px}
#frame ::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--text),transparent 70%)}
.ic{display:block;flex:none}
/* ---------- App-Schale ---------- */
.app{position:absolute;inset:0;display:grid;grid-template-columns:var(--navw) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.app.nav-bottom{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}
.nav{grid-row:1/3;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px;min-height:0}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;border-radius:8px;font-size:15px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--yellow);color:var(--ink);font-weight:600}
.nav .grow{flex:1}
.nav a.dim{color:var(--faint)}
.app.nav-rail .nav a{justify-content:center;padding:0}
.app.nav-rail .nav a span{display:none}
.main{min-width:0;min-height:0;padding:16px;display:flex;flex-direction:column;overflow:hidden}
.app.nav-bottom .main{padding:12px}
.footer{height:52px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11.25px;color:var(--muted);gap:12px;white-space:nowrap;overflow:hidden}
.footer .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);height:60px}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.25px;gap:2px;margin:6px;border-radius:8px;color:var(--text);text-decoration:none}
.bnav a.on{background:var(--yellow);color:var(--ink);font-weight:600}
/* ---------- Seite ---------- */
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex:none}
.phead h1{margin:0;font-size:18.75px;font-weight:600;line-height:1.3}
.phead p{margin:2px 0 0;font-size:13.125px;color:var(--muted)}
.phead .acts{display:flex;gap:2px;align-items:center}
.ws{flex:1;min-height:0;display:flex;gap:16px;position:relative}
.col{min-width:0;min-height:0;display:flex;flex-direction:column}
.grow{flex:1}
.scroll{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lbl{font-size:11.25px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
/* Ziehgriff wie .tts-resize */
.rh{position:relative;z-index:3;flex:none;width:12px;margin-inline:-14px;align-self:stretch;cursor:col-resize;touch-action:none;outline:none}
.rh::after{content:"";position:absolute;inset-block:0;inset-inline-start:5px;width:2px;border-radius:1px;background:transparent;transition:background-color .12s}
.rh:hover::after,.rh:focus-visible::after,.rh.drag::after{background:var(--yellow)}
.rhv{flex:none;height:12px;margin-block:-9px;cursor:row-resize;position:relative;z-index:3;touch-action:none;outline:none}
.rhv::after{content:"";position:absolute;inset-inline:0;top:5px;height:2px;border-radius:1px;background:transparent}
.rhv:hover::after,.rhv:focus-visible::after,.rhv.drag::after{background:var(--yellow)}
body.resizing,body.resizing *{user-select:none!important}
/* Knoepfe */
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--fill);display:inline-grid;place-items:center;flex:none;padding:0;position:relative;transition:background-color .12s,border-color .12s}
.ib:hover{background:color-mix(in srgb,var(--yellow) 30%,transparent);border-color:var(--yellow)}
.ib:focus-visible,.tab:focus-visible,.btn:focus-visible,.srow:focus-visible,.mrow:focus-visible,.mbtn:focus-visible,.chip:focus-visible,.src:focus-visible,.ts:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.ib.on{background:var(--sel);border-color:var(--yellow)}
.ib.gh{border-color:transparent;background:transparent;width:28px;height:28px;border-radius:6px;color:var(--faint)}
.ib.gh:hover{background:var(--hover);color:var(--text);border-color:transparent}
.ib.gh.lg{width:32px;height:32px;color:var(--muted)}
.ib.danger{color:var(--red)}
.ib.dis{opacity:.45}
.btn{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--fill);padding:0 14px;font-size:13.125px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 30%,transparent)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.pri:hover{background:color-mix(in srgb,var(--yellow) 82%,white)}
.btn.dng{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:11.25px}
.recdot{width:9px;height:9px;border-radius:50%;background:#ef4444;flex:none}
.recdot.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.recdot.pulse{animation:none}}
/* Transport (.mediabar/.mbtn) */
.mediabar{display:flex;align-items:center;gap:6px}
.mbtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--text);padding:0}
.mbtn:hover{background:var(--hover)}
.mbtn.play{background:var(--ink);color:var(--yellow);width:36px;height:36px}
#frame[data-theme=dark] .mbtn.play{background:var(--yellow);color:var(--ink)}
.tnum{font-variant-numeric:tabular-nums}
.seek{position:relative;height:4px;border-radius:2px;background:var(--line);cursor:pointer;margin:6px 2px 2px}
.seek i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--yellow)}
.seek b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--text)}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.25px;border:1px solid var(--line);color:var(--muted);background:transparent;white-space:nowrap}
button.chip:hover{border-color:var(--yellow);color:var(--text)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent;font-weight:500}
.chip.live{background:var(--redbg);color:var(--red);border-color:transparent;font-weight:600}
.chip.busy{background:var(--hover);color:var(--text);border-color:transparent}
.chip .mini{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.chip .mini i{display:block;height:100%;background:var(--yellow)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:#fff;margin-left:-4px;border:2px solid var(--bg)}
/* Reiter wie TabList compact */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:36px;padding:0 12px;border:0;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.125px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--yellow);font-weight:600}
.tab .cnt{font-size:11.25px;color:var(--faint);font-weight:500;margin-left:4px}
/* Sessions */
.shead{display:flex;align-items:center;gap:2px;height:32px;flex:none}
.search{display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line);background:var(--fill);border-radius:8px;padding:0 8px;margin:4px 0 8px;flex:none;color:var(--faint)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:13.125px;color:var(--text)}
.srow{display:flex;align-items:center;gap:7px;min-height:32px;padding:0 8px;border-radius:8px;font-size:13.125px;cursor:pointer;user-select:none;border:1px solid transparent}
.srow:hover{background:var(--hover)}
.srow.sel{background:var(--sel);font-weight:600}
.srow.drop{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,transparent)}
.srow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .c{font-size:11.25px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.srow input{flex:1;min-width:0;height:24px;border:1px solid var(--yellow);border-radius:6px;background:var(--bg);padding:0 6px;font-size:13.125px}
.mrow{display:block;padding:6px 8px 6px 30px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin:1px 0}
.mrow:hover{background:var(--hover)}
.mrow.sel{background:var(--sel)}
.mrow .t{font-size:13.125px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mrow .t span{overflow:hidden;text-overflow:ellipsis}
.mrow .m{font-size:11.25px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mrow .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:80px}
.mrow .bar i{display:block;height:100%;background:var(--yellow)}
.mrow.flat{padding-left:8px}
.empty{font-size:13.125px;color:var(--muted);padding:12px 8px}
.upnext{flex:none;border-top:1px solid var(--line);padding:8px 2px 0;margin-top:6px}
.upnext .ev{display:flex;align-items:center;gap:8px;font-size:13.125px;padding:4px 6px}
.upnext .ev .tt{flex:1;min-width:0}
.upnext .ev .tt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upnext .ev small{display:block;font-size:11.25px;color:var(--muted)}
/* Rail */
.rail{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail .ini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11.25px;font-weight:600;color:var(--muted);border:1px solid transparent;background:transparent}
.rail .ini:hover{background:var(--hover)}
.rail .ini.sel{background:var(--sel);color:var(--text)}
/* Detailkopf */
.dhead{flex:none;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.dh1{display:flex;align-items:center;gap:6px;min-width:0}
.dh1 h2{margin:0;font-size:16px;font-weight:600;line-height:1.35;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;border-radius:6px;padding:1px 4px;margin-left:-4px}
.dh1 h2:hover{background:var(--hover)}
.dh1 input{flex:1;min-width:0;height:28px;font-size:16px;font-weight:600;border:1px solid var(--yellow);border-radius:6px;background:var(--bg);padding:0 6px}
.dhead .tabs{margin:2px -16px 0;padding:0 10px}
/* Inhalt */
.pane{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.body{padding:12px 16px 16px}
.seg{display:grid;grid-template-columns:44px 96px minmax(0,1fr) 28px;gap:8px;align-items:start;padding:4px 6px;margin:0 -6px;border-radius:6px;font-size:13.125px;line-height:1.55}
.seg:hover{background:var(--hover)}
.seg .ts{border:0;background:transparent;padding:0;font-size:11.25px;color:var(--muted);text-align:left;font-variant-numeric:tabular-nums;padding-top:2px}
.seg .ts:hover{color:var(--text);text-decoration:underline}
.seg .spk{font-size:11.25px;font-weight:600;color:var(--c);padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg p{margin:0;color:color-mix(in srgb,var(--text) 92%,transparent)}
.seg .ib.gh{width:24px;height:24px;opacity:0}
.seg:hover .ib.gh,.seg:focus-within .ib.gh{opacity:1}
.seg.hl{background:color-mix(in srgb,var(--yellow) 28%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--yellow) 60%,transparent)}
.seg.now{background:color-mix(in srgb,var(--yellow) 12%,transparent)}
.seg.new{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.tx-compact .seg{grid-template-columns:40px minmax(0,1fr) 24px}
.tx-compact .seg .spk{display:none}
.tx-compact .seg p b{font-size:11.25px;color:var(--c);margin-right:4px}
.seg p b{display:none}
.tx-compact .seg p b{display:inline}
.follow{position:absolute;right:16px;bottom:12px;z-index:4;display:none;box-shadow:var(--shadow)}
.follow.show{display:inline-flex}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.notes li{display:grid;grid-template-columns:44px 20px minmax(0,1fr);gap:4px;font-size:14px;line-height:1.55;padding:3px 0}
.notes .nt{font-size:11.25px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.notes li.h{font-weight:600;font-size:15px;padding-top:8px}
.notes input[type=checkbox]{margin:5px 0 0;accent-color:var(--yellow)}
.notes li.done span{text-decoration:line-through;color:var(--muted)}
.nin{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
.nin input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--fill);padding:0 10px;font-size:14px;outline:none}
.nin input:focus{border-color:var(--yellow)}
.nin .hint{font-size:11.25px;color:var(--faint);white-space:nowrap}
.ai h3{font-size:13.125px;font-weight:600;margin:14px 0 6px}
.ai h3:first-child{margin-top:0}
.ai ul{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.55}
.ai ul.tasks{list-style:none;padding:0}
.ai li{margin:3px 0}
.ai ul.tasks li{display:flex;gap:8px;align-items:flex-start}
.ai ul.tasks input{margin-top:5px;accent-color:var(--yellow)}
.src{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:10.5px;color:var(--muted);margin-left:4px;vertical-align:1px;font-variant-numeric:tabular-nums}
.src:hover{border-color:var(--yellow);color:var(--text)}
.meta{font-size:11.25px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-bottom:10px}
.doc{font-size:14px;line-height:1.6;max-width:760px}
.doc h1{font-size:17px;margin:0 0 8px}
.doc h2{font-size:14px;margin:14px 0 4px}
.doc ul{margin:0;padding-left:20px}
.doc p{margin:0 0 6px}
/* Bedienung */
.ctl{display:flex;flex-direction:column;gap:12px;flex:none}
.ctl .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl .row.nowrap{flex-wrap:nowrap}
.recbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.recbox.live{border-color:color-mix(in srgb,#ef4444 45%,transparent);background:var(--redbg)}
.timer{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lvl{display:flex;flex-direction:column;gap:3px;flex:1;min-width:50px}
.lvl i{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lvl i b{display:block;height:100%;background:#22c55e;transition:width .15s}
.prog{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.prog .top{display:flex;align-items:center;gap:8px;font-size:13.125px;font-weight:500}
.prog .top .p{margin-left:auto;font-variant-numeric:tabular-nums}
.pbar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar2 i{display:block;height:100%;background:var(--yellow);transition:width .4s}
.prog .sub{display:flex;align-items:center;gap:6px;font-size:11.25px;color:var(--muted)}
.prog .sub .grow{flex:1}
.prog .ib{width:28px;height:28px}
.disc{border-top:1px solid var(--line);padding-top:4px;display:flex;flex-direction:column;min-height:0}
.disc>button{display:flex;align-items:center;gap:8px;min-height:40px;border:0;background:transparent;font-size:14px;font-weight:500;padding:0 2px;width:100%;text-align:left}
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}
.msg{font-size:13.125px;line-height:1.55;padding:8px 10px;border-radius:10px;background:var(--fill);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--sel);border-color:transparent;max-width:88%}
.recipes{display:flex;flex-wrap:wrap;gap:6px}
.cin{display:flex;gap:6px;align-items:flex-end;flex:none;padding-top:6px}
.cin textarea{flex:1;min-width:0;height:38px;resize:none;border:1px solid var(--line);border-radius:8px;background:var(--fill);padding:8px 10px;font-size:13.125px;outline:none}
.cin textarea:focus{border-color:var(--yellow)}
.hintline{font-size:11.25px;color:var(--faint)}
.drop-over{outline:2px dashed var(--yellow);outline-offset:-6px;background:color-mix(in srgb,var(--yellow) 6%,transparent)}
.dropmsg{position:absolute;inset:0;display:none;place-items:center;font-size:14px;font-weight:600;z-index:6;pointer-events:none}
.drop-over .dropmsg{display:grid}
/* Schmal (gestapelt) */
.nbar{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.nbar .tt{flex:1;min-width:0}
.nbar .tt div{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function importDlg(name){

/* ================= Simulation ================= */
let seq=0;
const nowIso=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function startRecording(title,sid){
  if(V.live){toast('Es läuft bereits eine Aufnahme.');return}
  sid=!sid||sid==='all'||sid==='none'?'s2':sid;
  const m=M({id:'live'+(++seq),title,session:sid,date:nowIso(),dur:0,status:'recording',people:['Anna M.','Jonas K.'],tx:[],notes:[],template:'Jour fixe'});
  m.consent=m.date;MEETINGS.unshift(m);V.live={id:m.id,paused:false,li:0,k:0};
  S.meeting=m.id;S.session=sid;S.tabA='transcript';S.tabB='notes';S.tabR='transcript';V.follow=true;V.dlg=null;V.drawer=false;
  renderApp();const ni=frame.querySelector('#notein');if(ni)ni.focus();
}
function stopRecording(){
  const m=byId(V.live.id);V.live=null;m.status='processing';m.job={phase:'Transkription abschließen',pct:0,paused:false,rate:14,queue:['KI-Notizen','Protokoll']};
  renderApp();toast('Aufnahme beendet – KI-Notizen und Protokoll entstehen jetzt.');
}
function importFile(name){
  const sid=S.session==='all'||S.session==='none'?'s2':S.session;
  const m=M({id:'imp'+(++seq),title:name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),session:sid,date:nowIso(),dur:1860,source:'import',file:name,tracks:'Datei (gemischt)',status:'processing',people:['Herr Vogt'],
    job:{phase:'Transkription',pct:0,paused:false,rate:4,queue:['KI-Notizen']}});
  m.txAll=genTx('m7',1860);m.tx=[];MEETINGS.unshift(m);S.meeting=m.id;S.session=sid;S.tabA='transcript';S.tabR='transcript';V.dlg=null;renderApp();
}
function genAiFor(m){
  const secs=[{title:'Kernpunkte',items:(m.notes.filter(n=>!n.todo).map(n=>[n.text,[n.t]]).concat(m.tx.slice(1,3).map(s=>[s.text,[s.t]]))).slice(0,4)},{title:'Entscheidungen',items:m.tx.slice(-3,-2).map(s=>[s.text,[s.t]])}];
  const tasks=m.notes.filter(n=>n.todo).map(n=>[n.text,'Ich','',n.t,false]);if(m.tx[8])tasks.push(['Nachfassen: '+m.tx[8].text.slice(0,48)+' …',m.tx[8].spk,'',m.tx[8].t,false]);
  m.ai={sections:secs,tasks};
}
function genMinFor(m){m.minutes=true;m.minutesHtml=`<h1>Protokoll: ${esc(m.title)}</h1><p><b>Datum:</b> ${dlong(m.date)} · <b>Dauer:</b> ${Math.max(1,Math.round(m.dur/60))} Min. · <b>Teilnehmende:</b> ${esc(['Patrick',...m.people].join(', '))}</p><h2>Ergebnisse</h2><ul>${m.tx.slice(0,4).map(s=>`<li>${esc(s.text)}</li>`).join('')}</ul><h2>Aufgaben</h2><ul>${(m.ai?m.ai.tasks:[]).map(t=>`<li>${esc(t[0])} – ${esc(t[1])}</li>`).join('')||'<li>keine</li>'}</ul>`}
function appendSegs(m,segs){
  if(m.id!==S.meeting)return;const tx=frame.querySelector('#txscroll');if(!tx)return;
  const e=tx.querySelector('.empty');if(e)e.remove();
  tx.insertAdjacentHTML('beforeend',segs.map(s=>segHTML(s,0,true)).join(''));
  if(V.follow)tx.scrollTop=tx.scrollHeight;else frame.querySelector('#followbtn')?.classList.add('show');
}
function setAll(sel,fn){frame.querySelectorAll(sel).forEach(fn)}
function tick(){
  if(V.live&&!V.live.paused){
    const m=byId(V.live.id);m.dur++;V.live.k++;
    if(V.live.k%3===0){const [spk,text]=LIVE_LINES[V.live.li%LIVE_LINES.length];V.live.li++;const s={t:m.dur,spk,text};m.tx.push(s);appendSegs(m,[s])}
    setAll('[data-livetime]',el=>el.textContent=mmss(m.dur));setAll(`[data-mdur="${m.id}"]`,el=>el.textContent=mmss(m.dur));
    setAll('.nin .hint',el=>{if(m.id===S.meeting)el.lastChild.textContent=' '+mmss(m.dur)});
  }
  if(V.play.on){const m=byId(V.play.id);V.play.pos=Math.min(m.dur,V.play.pos+1);if(V.play.pos>=m.dur)V.play.on=false;paintPlay()}
  let rerender=false;
  for(const m of MEETINGS){
    if(m.status!=='processing'||!m.job||m.job.paused)continue;
    const j=m.job;j.pct=Math.min(100,j.pct+(j.rate||0.3));
    if(m.txAll){const n=Math.floor(m.txAll.length*Math.min(j.pct,100)/100);if(n>m.tx.length&&j.phase==='Transkription'){const add=m.txAll.slice(m.tx.length,n);m.tx.push(...add);appendSegs(m,add)}}
    setAll(`[data-pbar="${m.id}"]`,el=>el.style.width=j.pct+'%');setAll(`[data-ppct="${m.id}"]`,el=>el.textContent=Math.floor(j.pct)+' %');
    if(j.pct>=100){
      if(j.phase==='KI-Notizen')genAiFor(m);if(j.phase==='Protokoll')genMinFor(m);
      if(j.phase==='Neu-Transkription'){m.versions++;m.model=j.model||m.model}
      if(j.queue&&j.queue.length){j.phase=j.queue.shift();j.pct=0;j.rate=j.phase==='Protokoll'?20:16}
      else{m.status='ready';delete m.job;if(m.txAll){m.tx=m.txAll;delete m.txAll}if(m.id===S.meeting)toast(`„${m.title}“ ist fertig.`)}
      rerender=true;
    }
  }
  if(rerender)renderApp();
}
function paintPlay(){
  const m=byId(V.play.id);if(!m||m.id!==S.meeting)return;const pct=Math.min(100,V.play.pos/m.dur*100);
  setAll('[data-ppos]',el=>el.textContent=mmss(V.play.pos));setAll('[data-pfill]',el=>el.style.width=pct+'%');setAll('[data-pknob]',el=>el.style.left=pct+'%');
  const segs=[...frame.querySelectorAll('#txscroll .seg')];let cur=null;segs.forEach(s=>{s.classList.remove('now');if(+s.dataset.t<=V.play.pos)cur=s});
  if(cur&&V.play.on){cur.classList.add('now')}
}
function jumpTo(t){
  const md=modes();
  if(S.variant==='A'||md.ws==='narrow'&&S.variant==='A')S.tabA='transcript';else{S.tabR='transcript';if(S.col.r)S.col.r=false}
  renderApp();
  const tx=frame.querySelector('#txscroll');if(!tx)return;const segs=[...tx.querySelectorAll('.seg')];let best=segs[0];
  segs.forEach(s=>{if(+s.dataset.t<=t)best=s});
  if(best){V.follow=false;best.scrollIntoView({block:'center'});best.classList.add('hl');setTimeout(()=>best.classList.remove('hl'),2600)}
}
function answer(m,q){
  const c=V.chat[m.id]=V.chat[m.id]||[];c.push({me:1,html:esc(q)});
  const pick=m.tx.length?[m.tx[Math.min(3,m.tx.length-1)],m.tx[Math.min(11,m.tx.length-1)]]:[];
  const cite=s=>`<button class="src" data-act="jump" data-t="${s.t}">${mmss(s.t)}</button>`;
  setTimeout(()=>{c.push({html:m.id==='m2'?`Die Lastspitzen liegen werktags zwischen 7:30 und 9:00 Uhr ${cite(m.tx[3])}. Ein Speicher mit 400 kWh würde etwa ein Drittel davon kappen ${cite(m.tx[11])}; offen ist noch der Tarif 2027 ${cite(m.tx[26])}.`:pick.length?`${esc(pick[0].text)} ${cite(pick[0])} Außerdem: ${esc(pick[1].text)} ${cite(pick[1])}`:'Noch nichts transkribiert.'});renderApp()},700);
  renderApp();
}

  skip:el=>{const m=cur();if(V.play.id!==m.id)V.play={on:false,pos:0,id:m.id};V.play.pos=Math.max(0,Math.min(m.dur,V.play.pos+ +el.dataset.d));paintPlay()},

  menu:el=>meetingMenu(el,cur(),modes()),

  moveTo:el=>{const m=byId(el.dataset.id)||cur();m.session=el.dataset.sid||null;V.menu=null;renderApp();toast(`Verschoben nach „${sessName(m.session)}“`)},

  retransGo:()=>{const m=cur();const mod=frame.querySelector('#rt-model').value.replace(' (eingestellt)','');m.status='processing';m.job={phase:'Neu-Transkription',pct:0,paused:false,rate:5,queue:[],model:mod};V.dlg=null;renderApp()},

  genMin:()=>{const m=cur();if(!m.tx.length){toast('Erst braucht es ein Transkript.');return}m.status='processing';m.job={phase:'Protokoll',pct:0,paused:false,rate:20,queue:[]};V.menu=null;S.tabA='minutes';S.tabB='minutes';renderApp()},

/* ================= Ereignisse (delegiert) ================= */
frame.addEventListener('click',e=>{
  hideTip();
  const a=e.target.closest('[data-act]');
  if(V.menu&&!e.target.closest('.menu')&&!(a&&/menu|moveMenu|menuTpl/.test(a.dataset.act))){V.menu=null;renderLayer();if(!a)return}
  if(!a||!frame.contains(a))return;
  if(a.tagName==='A')e.preventDefault();
  if(a.type==='checkbox'&&a.dataset.act!=='noteDone')return;
  const f=ACT[a.dataset.act];if(f){e.stopPropagation();f(a,e)}
});
frame.addEventListener('dblclick',e=>{
  const h=e.target.closest('[data-rh]');if(h){setWidth(h.dataset.rh,+h.dataset.def);return}
  if(e.target.closest('[data-rhv]')){S.split=.5;renderApp();return}
  const sr=e.target.closest('.srow[data-ctx=session]');if(sr){V.renameS=sr.dataset.sid;renderApp()}
});
frame.addEventListener('contextmenu',e=>{
  const t=e.target.closest('[data-ctx]');if(!t)return;e.preventDefault();
  const fr=frame.getBoundingClientRect();const p={x:(e.clientX-fr.left)/V.scale,y:(e.clientY-fr.top)/V.scale};
  if(t.dataset.ctx==='session'){const sid=t.dataset.sid;openMenu(t,[{label:'Umbenennen',icon:'pencil',act:'sessRename',data:{sid}},{label:'Nach oben',icon:'arrowUp',act:'sessUp',data:{sid}},{label:'Nach unten',icon:'arrowDn',act:'sessDown',data:{sid}},{sep:1},{label:'Session löschen …',icon:'trash',act:'sessDel',danger:1,data:{sid}}],p)}
  else{const id=t.dataset.id;S.meeting=id;renderApp();openMenu(t,[{label:'In Session verschieben …',icon:'move',act:'moveMenu'},{label:'Umbenennen',icon:'pencil',act:'rename'},{label:'Details …',icon:'info',act:'details'},{sep:1},{label:'Besprechung löschen …',icon:'trash',act:'delMeeting',danger:1,data:{id}}],p)}
});
frame.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){if(V.menu){V.menu=null;renderLayer();return}if(V.dlg){closeDlg();return}if(V.rename||V.renameS){V.rename=V.renameS=null;renderApp();return}if(V.drawer){V.drawer=false;renderApp();return}}
  if(t.id==='notein'&&e.key==='Enter'&&t.value.trim()){const m=cur();let v=t.value.trim();const todo=/^\[ ?\]\s*/.test(v);v=v.replace(/^\[ ?\]\s*/,'');m.notes.push({t:m.status==='recording'?m.dur:(V.play.id===m.id?V.play.pos:0),text:v,todo});t.value='';renderApp();const ns=frame.querySelector('#notescroll');if(ns)ns.scrollTop=ns.scrollHeight;frame.querySelector('#notein')?.focus();return}
  if(t.id==='mrename'&&(e.key==='Enter')){const v=t.value.trim();if(v)cur().title=v;V.rename=null;renderApp();return}
  if(t.id==='srename'&&e.key==='Enter'){const s=SESSIONS.find(x=>x.id===t.dataset.sid);if(s&&t.value.trim())s.name=t.value.trim();V.renameS=null;renderApp();return}
  if(t.id==='chatin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACT.send();return}
  if(e.key==='F2'&&!/INPUT|TEXTAREA/.test(t.tagName)){ACT.rename();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();ACT.askSession();return}
  if(t.getAttribute('role')==='tab'&&/Arrow(Left|Right)|Home|End/.test(e.key)){const tabs=[...t.parentElement.querySelectorAll('[role=tab]')];let i=tabs.indexOf(t);i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();ACT.tab(tabs[i]);return}
  if(t.dataset&&t.dataset.rh&&/Arrow(Left|Right)|Home|End/.test(e.key)){e.preventDefault();const w=+t.getAttribute('aria-valuenow');const dir=t.dataset.rh==='s'?1:-1;const nv=e.key==='Home'?+t.dataset.min:e.key==='End'?+t.dataset.max:w+(e.key==='ArrowRight'?16:-16)*dir;setWidth(t.dataset.rh,nv);frame.querySelector(`[data-rh="${t.dataset.rh}"]`)?.focus();return}
  if(t.dataset&&t.dataset.rhv&&/Arrow(Up|Down)/.test(e.key)){e.preventDefault();S.split=Math.max(.25,Math.min(.75,S.split+(e.key==='ArrowDown'?.05:-.05)));renderApp();frame.querySelector('[data-rhv]')?.focus();return}
  if((e.key==='Enter'||e.key===' ')&&t.matches('.srow,.mrow,h2[data-act]')){e.preventDefault();t.click();return}
  if(t.closest('.menu')&&/Arrow(Up|Down)/.test(e.key)){e.preventDefault();const it=[...frame.querySelectorAll('.menu .mi')];let i=it.indexOf(t);it[(i+(e.key==='ArrowDown'?1:-1)+it.length)%it.length].focus()}
});
frame.addEventListener('focusout',e=>{const t=e.target;if(t.id==='srename'&&V.renameS){setTimeout(()=>{if(V.renameS&&!frame.querySelector('#srename:focus')){const s=SESSIONS.find(x=>x.id===t.dataset.sid);if(s&&t.value.trim())s.name=t.value.trim();V.renameS=null;renderApp()}},0)}
  if(t.id==='mrename'&&V.rename){setTimeout(()=>{if(V.rename&&!frame.querySelector('#mrename:focus')){if(t.value.trim())cur().title=t.value.trim();V.rename=null;renderApp()}},0)}});
frame.addEventListener('input',e=>{if(e.target.id==='ssearch'){V.search=e.target.value;const sc=frame.querySelector('#sscroll');if(sc)sc.innerHTML=sessionsBody()}});
frame.addEventListener('scroll',e=>{hideTip();if(e.target.id==='txscroll'){const el=e.target;const atEnd=el.scrollHeight-el.scrollTop-el.clientHeight<24;V.follow=atEnd;const b=frame.querySelector('#followbtn');if(b)b.classList.toggle('show',!atEnd&&(!!V.live&&V.live.id===S.meeting||cur().status==='processing'))}},true);
/* Ziehen: Besprechung auf Session, Datei auf Inhalt */
frame.addEventListener('dragstart',e=>{const r=e.target.closest('.mrow');if(r){e.dataTransfer.setData('text/x-meeting',r.dataset.id);e.dataTransfer.effectAllowed='move'}});
frame.addEventListener('dragover',e=>{
  const types=[...e.dataTransfer.types];
  const s=e.target.closest('[data-drop]');if(s&&types.includes('text/x-meeting')){e.preventDefault();frame.querySelectorAll('.srow.drop').forEach(x=>x!==s&&x.classList.remove('drop'));s.classList.add('drop');return}
  const z=e.target.closest('[data-dropzone]');if(z&&types.includes('Files')){e.preventDefault();z.classList.add('drop-over')}
});
frame.addEventListener('dragleave',e=>{const s=e.target.closest('.srow.drop');if(s&&!s.contains(e.relatedTarget))s.classList.remove('drop');const z=e.target.closest('.drop-over');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-over')});
frame.addEventListener('drop',e=>{
  const s=e.target.closest('[data-drop]');const id=e.dataTransfer.getData('text/x-meeting');
  if(s&&id){e.preventDefault();const m=byId(id);m.session=s.dataset.sid;toast(`„${m.title}“ → ${sessName(m.session)}`);renderApp();return}
  const z=e.target.closest('[data-dropzone]');if(z&&e.dataTransfer.files.length){e.preventDefault();z.classList.remove('drop-over');importDlg(e.dataTransfer.files[0].name)}
});
/* Ziehgriffe */
function setWidth(which,v){
  const lim={s:[180,400],c:[260,440],r:[300,640]}[which];v=Math.max(lim[0],Math.min(lim[1],Math.round(v)));
  if(which==='s'){S.variant==='A'?S.wA.s=v:S.wB.s=v}else if(which==='c')S.wA.c=v;else S.wB.r=v;renderApp();
}
frame.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-rh]');
  if(h){e.preventDefault();h.setPointerCapture(e.pointerId);h.classList.add('drag');document.body.classList.add('resizing');
    const which=h.dataset.rh;const col=which==='s'?h.previousElementSibling:h.nextElementSibling;const x0=e.clientX,w0=col.getBoundingClientRect().width/V.scale;const lim={s:[180,400],c:[260,440],r:[300,640]}[which];let w=w0;
    const mv=ev=>{const d=(ev.clientX-x0)/V.scale;w=Math.max(lim[0],Math.min(lim[1],w0+(which==='s'?d:-d)));col.style.width=w+'px';h.setAttribute('aria-valuenow',Math.round(w))};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);document.body.classList.remove('resizing');setWidth(which,w)};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);return}
  const hv=e.target.closest('[data-rhv]');
  if(hv){e.preventDefault();hv.setPointerCapture(e.pointerId);hv.classList.add('drag');document.body.classList.add('resizing');const box=frame.querySelector('#nsplit');const a=hv.previousElementSibling,b=hv.nextElementSibling;
    const top=a.getBoundingClientRect().top,bot=b.getBoundingClientRect().bottom;let f=S.split;
    const mv=ev=>{f=Math.max(.25,Math.min(.75,(ev.clientY-top)/(bot-top)));a.style.flex=`${f*100} 1 0`;b.style.flex=`${(1-f)*100} 1 0`};
    const up=()=>{hv.removeEventListener('pointermove',mv);hv.removeEventListener('pointerup',up);document.body.classList.remove('resizing');S.split=f;renderApp()};
    hv.addEventListener('pointermove',mv);hv.addEventListener('pointerup',up)}
});
/* Tooltips: Name + Kurzerklaerung, Maus und Tastatur */
let tipTimer=null;
function showTip(el){
  const [n,d]=el.dataset.tip.split('|');let t=frame.querySelector('.tip');if(!t){t=document.createElement('div');t.className='tip';t.setAttribute('role','tooltip');frame.appendChild(t)}
  t.innerHTML=`<b>${esc(n)}</b>${d?esc(d):''}`;t.style.display='block';
  const fr=frame.getBoundingClientRect(),r=el.getBoundingClientRect();let x=(r.left-fr.left)/V.scale,y=(r.bottom-fr.top)/V.scale+6;
  const w=t.offsetWidth,h=t.offsetHeight;if(x+w>V.frameW-8)x=V.frameW-w-8;if(y+h>V.frameH-8)y=(r.top-fr.top)/V.scale-h-6;t.style.left=Math.max(8,x)+'px';t.style.top=y+'px';
}
function hideTip(){clearTimeout(tipTimer);const t=frame.querySelector('.tip');if(t)t.style.display='none'}
frame.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el){return}clearTimeout(tipTimer);tipTimer=setTimeout(()=>showTip(el),380)});
frame.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTip()});
frame.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el&&el.matches(':focus-visible'))showTip(el);else hideTip()});

/* ================= Rahmen-Steuerung und Start ================= */
document.getElementById('pv').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.variant=b.dataset.v;renderApp()}});
document.getElementById('pw').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.size=b.dataset.w;V.drawer=false;layoutFrame();renderApp()}});
document.getElementById('pt').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.theme=b.dataset.t;renderApp()}});
document.getElementById('preset').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=structuredClone(DEF);V.drawer=false;layoutFrame();renderApp()});
window.addEventListener('resize',()=>{layoutFrame();renderApp()});
layoutFrame();renderApp();
setInterval(tick,1000);
setInterval(()=>{if(V.live&&!V.live.paused)setAll('[data-lvl]',el=>el.style.width=(15+Math.random()*70)+'%')},250);
setInterval(checkScroll,1000);
</script>
